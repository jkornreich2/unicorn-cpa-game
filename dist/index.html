<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorn: Seed to IPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a founder's finance console at night. One ticker (valuation) is the loud element; cases arrive as messages on glass panels. Single dark theme by choice. */
  color-scheme: dark;
  --bg:#090c15;
  --panel:#121726;
  --panel-2:#1a2033;
  --edge:rgba(255,255,255,.09);
  --text:#eef0f6;
  --dim:#98a0b8;
  --accent:#ff7a59;      /* term-sheet coral */
  --far:#5cc8ff; --aud:#ffc857; --reg:#c58bff;
  --good:#58d6a0; --bad:#ff6b7d;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(600px 320px at 85% -80px,rgba(92,200,255,.13),transparent 70%),radial-gradient(520px 300px at 0% 0%,rgba(255,122,89,.10),transparent 70%);background-repeat:no-repeat;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:38px;font-weight:800}
h2{font-size:24px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.dim{color:var(--dim);font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Top console */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.co{font-family:var(--display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.co i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.stages{display:flex;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.stages span{padding:4px 8px;border-radius:99px;border:1px solid var(--edge);color:var(--dim)}
.stages span.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.stages span.done{color:var(--good);border-color:rgba(88,214,160,.4)}
.ticker{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.ticker small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.val{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.trust{min-width:120px}
.bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transition:width .4s}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-height:42px;background:transparent;border:1px solid var(--edge);border-radius:12px;color:var(--dim);font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--text);border-color:rgba(255,255,255,.22)}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:6px;color:var(--bg);background:var(--c)}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{background:var(--panel-2);border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:15.5px}
.msg b{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:3px}
.q{font-weight:600;font-size:16.5px}
.opt{width:100%;min-height:48px;text-align:left;background:transparent;border:1px solid var(--edge);border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.35}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.3)}
.opt.right{border-color:var(--good);background:rgba(88,214,160,.10)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,125,.10)}
.opt:disabled{cursor:default}
.opts{display:flex;flex-direction:column;gap:8px}
.btn{min-height:48px;border-radius:12px;border:none;background:var(--accent);color:#1a0d08;font-weight:600;padding:11px 18px;flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.numrow{display:flex;gap:8px}
.numrow label{flex:1;display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;padding:0 12px;font-family:var(--mono)}
.numrow input{flex:1;min-width:0;height:48px;background:transparent;border:none;outline:none;font-family:var(--mono);font-size:18px}
.numrow .btn{flex:0 0 auto}
.fb{border-left:3px solid var(--c);background:var(--panel-2);border-radius:0 12px 12px 0;padding:11px 13px;font-size:15px}
.fb.good{--c:var(--good)} .fb.bad{--c:var(--bad)} .fb.tip{--c:var(--accent)}
.fb b{font-weight:600}
.verdict{font-family:var(--display);font-weight:800;font-size:20px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}

/* Journal */
.je{width:100%;border-collapse:collapse;font-size:14.5px}
.je th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:500;padding:4px 6px}
.je td{padding:5px 6px;border-top:1px solid var(--edge)}
.je .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;width:84px}
.slot{width:100%;min-height:44px;text-align:left;background:var(--panel-2);border:1px dashed rgba(255,255,255,.3);border-radius:10px;padding:8px 10px;font-size:14.5px}
.slot.cr{margin-left:18px;width:calc(100% - 18px)}
.slot.on{border:1px solid var(--accent);box-shadow:0 0 0 3px rgba(255,122,89,.25)}
.slot em{font-style:normal;color:var(--dim)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{min-height:44px;text-align:left;background:transparent;border:1px solid var(--edge);border-radius:10px;padding:7px 10px;font-size:14px;line-height:1.2}
.chip.sel{background:var(--text);color:var(--bg)}

/* Scorecard and deals */
.sec{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}
.sec .bar{margin:0}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--edge);font-size:14.5px}
.item .tag{font-size:10px;padding:3px 6px}
.deal{border:1px solid rgba(255,122,89,.45);background:linear-gradient(160deg,rgba(255,122,89,.12),transparent 60%),var(--panel)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.kv span{color:var(--dim)}
.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.big{font-family:var(--mono);font-weight:700;font-size:44px;line-height:1;color:var(--accent);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.big{animation:none}.bar b{transition:none}}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hq{position:relative;height:280px;border-radius:18px;overflow:hidden;border:1px solid var(--edge);background:#070a13}
@media (min-width:560px){.hq{height:340px}}
.hq canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.hq canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hqcap{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hqcap span{background:rgba(9,12,21,.72);padding:4px 8px;border-radius:6px}
.legend{position:absolute;top:10px;right:10px;display:flex;gap:6px;pointer-events:none;font-size:11px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:5px;background:rgba(9,12,21,.72);padding:3px 7px;border-radius:6px}
.legend i{width:8px;height:8px;border-radius:2px;background:var(--c)}
@media (max-width:420px){.hqcap .hint{display:none}}
@media (max-width:380px){.val{font-size:28px}h1{font-size:31px}.chips{grid-template-columns:1fr}.stages span{padding:4px 6px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="co"><i></i>Kestrel AI</div>
    <div class="stages" id="stages"></div>
  </header>
  <section class="hq" id="hq">
    <canvas id="hqc" tabindex="0" aria-label="3D view of Kestrel's headquarters. One floor is added for every case you answer."></canvas>
    <div class="legend" aria-hidden="true"><span><i style="--c:#ffd58a"></i>Correct</span><span><i style="--c:#ff6b7d"></i>Missed</span></div>
    <div class="hqcap"><span id="hqcap">HQ · The garage · 0 floors</span><span class="hint">Drag or use ← → to look around</span></div>
  </section>
  <section class="ticker" aria-label="Company status">
    <div><small>Valuation</small><div class="val" id="val">$6.0M</div></div>
    <div class="trust"><small>Board trust <span class="mono" id="trustN">70</span></small><div class="bar"><b id="trustB" style="width:70%"></b></div></div>
  </section>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-play" data-act="tab" data-v="play">Desk</button>
    <button role="tab" id="tab-score" data-act="tab" data-v="score">Scorecard</button>
  </nav>
  <main id="view"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>// Kestrel HQ: a 3D building that gains one floor per answered case.
// Floors: Seed = wooden garage, Series A = brick loft, IPO = glass tower.
// Window light shows the result: warm/blue = correct, dimmer = second try, red = missed.
// Needs THREE (r128 UMD) loaded before this script. Exposes window.HQ.update(state).
window.HQ = (() => {
  const host = document.getElementById("hq");
  const cv = document.getElementById("hqc");
  const cap = document.getElementById("hqcap");
  const off = { update() {} };
  if (!window.THREE || !host || !cv) { if (host) host.hidden = true; return off; }

  let R;
  try { R = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); }
  catch (e) { host.hidden = true; return off; }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  R.shadowMap.enabled = true;
  R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a13);
  scene.fog = new THREE.Fog(0x070a13, 45, 110);
  const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 300);

  const hemi = new THREE.HemisphereLight(0x9db8ff, 0x0a0e18, 0.6);
  scene.add(hemi);
  const moon = new THREE.DirectionalLight(0xc8d6ff, 0.8);
  moon.position.set(-16, 30, 14);
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024, 1024);
  Object.assign(moon.shadow.camera, { left: -24, right: 24, top: 36, bottom: -12, near: 1, far: 100 });
  scene.add(moon);
  const warm = new THREE.PointLight(0xff7a59, 0.9, 34);
  warm.position.set(5, 3, 9);
  scene.add(warm);

  const rng = (seed) => { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; };
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

  // ---------- Ground, street, stars ----------
  const flat = (w, d, color, y, x = 0, z = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color, roughness: 1 }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
  };
  const groundMesh = flat(240, 240, 0x0b111e, 0);
  flat(14, 11, 0x141b2b, 0.005);
  flat(240, 4, 0x121827, 0.01, 0, 8);
  const dashMat = new THREE.MeshBasicMaterial({ color: 0x3a4258 });
  for (let x = -60; x <= 60; x += 3) {
    const d = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.12), dashMat);
    d.rotation.x = -Math.PI / 2; d.position.set(x, 0.02, 8); scene.add(d);
  }
  let starMat;
  {
    const r = rng(17), n = 500, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const th = r() * Math.PI * 2, ph = r() * 0.45 * Math.PI, rad = 120;
      pos[i * 3] = rad * Math.cos(th) * Math.sin(ph + 0.6);
      pos[i * 3 + 1] = 18 + rad * Math.cos(ph + 0.6) * 0.9 + r() * 20;
      pos[i * 3 + 2] = rad * Math.sin(th) * Math.sin(ph + 0.6);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    starMat = new THREE.PointsMaterial({ color: 0xdfe6ff, size: 0.6, sizeAttenuation: true, fog: false, transparent: true, opacity: 1 });
    scene.add(new THREE.Points(g, starMat));
  }

  // ---------- Sky dome and per-round settings ----------
  // Seed: Palo Alto at golden hour. Series A: dusk. IPO: night.
  const SETTINGS = [
    { top: 0x1f2d58, mid: 0x8a5a78, hor: 0xf3a65c, fog: 0xc98d62, groundC: 0x3a3226, sun: 0xffc48a, sunI: 1.15, sunPos: [-30, 14, 22], hs: 0xffd8ab, hg: 0x3a2f22, hI: 0.75, stars: 0 },
    { top: 0x0d1430, mid: 0x3a2a5c, hor: 0x8a4f6e, fog: 0x2c2240, groundC: 0x121522, sun: 0xc3b2ff, sunI: 0.7, sunPos: [-20, 22, 16], hs: 0xa99cf0, hg: 0x0e0e1a, hI: 0.6, stars: 0.5 },
    { top: 0x05070f, mid: 0x0b1226, hor: 0x1a2238, fog: 0x0b0f1c, groundC: 0x0b111e, sun: 0xc8d6ff, sunI: 0.8, sunPos: [-16, 30, 14], hs: 0x9db8ff, hg: 0x0a0e18, hI: 0.6, stars: 1 }
  ];
  const skyGeo = new THREE.SphereGeometry(150, 32, 16);
  const skyCol = new Float32Array(skyGeo.attributes.position.count * 3);
  skyGeo.setAttribute("color", new THREE.BufferAttribute(skyCol, 3));
  const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  scene.add(sky);
  const cur = { top: new THREE.Color(), mid: new THREE.Color(), hor: new THREE.Color(), fog: new THREE.Color(), groundC: new THREE.Color(),
                sun: new THREE.Color(), hs: new THREE.Color(), hg: new THREE.Color(), sunI: 0, hI: 0, stars: 1, sunPos: new THREE.Vector3() };
  let setFrom = null, setTo = SETTINGS[2], setStart = -1e9;
  const tmpA = new THREE.Color(), tmpB = new THREE.Color();
  const applySetting = (k) => {
    const A = setFrom || setTo, B = setTo;
    ["top", "mid", "hor", "fog", "groundC", "sun", "hs", "hg"].forEach((key) => cur[key].copy(tmpA.set(A[key])).lerp(tmpB.set(B[key]), k));
    cur.sunI = A.sunI + (B.sunI - A.sunI) * k; cur.hI = A.hI + (B.hI - A.hI) * k; cur.stars = A.stars + (B.stars - A.stars) * k;
    cur.sunPos.set(...A.sunPos).lerp(new THREE.Vector3(...B.sunPos), k);
    const pos = skyGeo.attributes.position, c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i) / 150;
      if (y < 0.12) c.copy(cur.hor).lerp(cur.mid, Math.max(0, y) / 0.12 * 0.5);
      else c.copy(cur.mid).lerp(cur.top, Math.min(1, (y - 0.12) / 0.6));
      skyCol[i * 3] = c.r; skyCol[i * 3 + 1] = c.g; skyCol[i * 3 + 2] = c.b;
    }
    skyGeo.attributes.color.needsUpdate = true;
    scene.background = cur.fog; scene.fog.color.copy(cur.fog);
    groundMesh.material.color.copy(cur.groundC);
    moon.color.copy(cur.sun); moon.intensity = cur.sunI; moon.position.copy(cur.sunPos);
    hemi.color.copy(cur.hs); hemi.groundColor.copy(cur.hg); hemi.intensity = cur.hI;
    starMat.opacity = cur.stars; starMat.visible = cur.stars > 0.02;
  };

  // ---------- Facade textures ----------
  const canvasTex = (draw, w = 256, h = 128) => {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  };
  const STY = [
    { name: "The garage · Palo Alto", w: 7.2, d: 5.6, h: 1.8, wall: "#2a2c30", frame: "#17181b", cols: 3, win: 0xffc98a, seed: 3, batten: true },
    { name: "The loft", w: 6.4, d: 5.4, h: 1.55, wall: "#6b3328", frame: "#3a1e17", cols: 5, brick: true, win: 0xffd58a, seed: 5 },
    { name: "The tower", w: 5, d: 5, h: 1.35, wall: "#1b2c47", frame: "#2c4166", cols: 8, glass: true, win: 0xaee0ff, seed: 9 }
  ];
  const facade = (ctx, w, h, st, mode) => {
    ctx.fillStyle = mode === "map" ? st.wall : "#000"; ctx.fillRect(0, 0, w, h);
    if (mode === "map" && st.brick) { ctx.fillStyle = "rgba(0,0,0,.2)"; for (let y = 4; y < h; y += 8) ctx.fillRect(0, y, w, 1); }
    if (mode === "map" && st.batten) { for (let x = 4; x < w; x += 12) { ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fillRect(x, 0, 2, h); ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(x + 2, 0, 1, h); } }
    const r = rng(st.seed), pad = w * 0.04, gw = (w - pad * 2) / st.cols, wy = h * (st.glass ? 0.12 : 0.22), wh = h * (st.glass ? 0.76 : 0.56);
    for (let i = 0; i < st.cols; i++) {
      const x = pad + i * gw + gw * (st.glass ? 0.06 : 0.14), ww = gw * (st.glass ? 0.88 : 0.72);
      const on = mode === "full" || (mode === "sparse" && r() < 0.4);
      ctx.fillStyle = mode === "map" ? (st.glass ? "#0d1830" : "#141a28") : on ? "#fff" : "#000";
      ctx.fillRect(x, wy, ww, wh);
      if (mode === "map") { ctx.fillStyle = st.frame; ctx.fillRect(x + ww / 2 - 1, wy, 2, wh); ctx.fillRect(x, wy + wh / 2 - 1, ww, 2); }
    }
  };
  STY.forEach((s) => {
    s.tex = { map: canvasTex((c, w, h) => facade(c, w, h, s, "map")),
              full: canvasTex((c, w, h) => facade(c, w, h, s, "full")),
              sparse: canvasTex((c, w, h) => facade(c, w, h, s, "sparse")) };
    s.topMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(s.frame), roughness: 0.9 });
  });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x0f1422, roughness: 0.8 });

  // grade: 2 = right first time, 1 = right on second try, 0 = missed
  const makeFloor = (st, grade) => {
    const side = new THREE.MeshStandardMaterial({
      map: st.tex.map, emissiveMap: grade ? st.tex.full : st.tex.sparse,
      emissive: new THREE.Color(grade ? st.win : 0xff5a6e),
      emissiveIntensity: grade === 2 ? 1.05 : grade === 1 ? 0.55 : 0.6,
      roughness: st.glass ? 0.3 : 0.85, metalness: st.glass ? 0.45 : 0.05
    });
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(st.w, st.h * 0.86, st.d), [side, side, st.topMat, st.topMat, side, side]);
    body.position.y = st.h * 0.43; body.castShadow = body.receiveShadow = true; g.add(body);
    const slab = new THREE.Mesh(new THREE.BoxGeometry(st.w + 0.25, st.h * 0.14, st.d + 0.25), trimMat);
    slab.position.y = st.h * 0.93; slab.castShadow = true; g.add(slab);
    return g;
  };

  // ---------- Kestrel building ----------
  const building = new THREE.Group(); scene.add(building);
  let floors = [];            // { grp, r, g, y, start }
  let topY = 0;

  const ghosts = STY.map((st) => {
    const geo = new THREE.BoxGeometry(st.w, st.h, st.d);
    const grp = new THREE.Group();
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xff7a59, transparent: true }));
    const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff7a59, transparent: true, opacity: 0.06, depthWrite: false }));
    edges.position.y = fill.position.y = st.h / 2;
    grp.add(edges, fill); grp.visible = false; scene.add(grp);
    return { grp, edges, fill };
  });
  let ghostOn = -1;

  const sign = (() => {
    const tex = canvasTex((c, w, h) => {
      c.clearRect(0, 0, w, h);
      c.font = "800 78px 'Bricolage Grotesque', 'Avenir Next', sans-serif";
      c.textAlign = "center"; c.textBaseline = "middle";
      c.shadowColor = "#ff7a59"; c.shadowBlur = 24; c.fillStyle = "#ff8a6a";
      c.fillText("KESTREL AI", w / 2, h / 2);
    }, 512, 128);
    const grp = new THREE.Group();
    const board = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 1.1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
    board.position.y = 0.95; grp.add(board);
    const postMat = new THREE.MeshStandardMaterial({ color: 0x2b3550 });
    [-1.6, 1.6].forEach((x) => { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), postMat); p.position.set(x, 0.3, -0.05); grp.add(p); });
    grp.visible = false; scene.add(grp); return grp;
  })();

  const roofCap = (() => {
    const st = STY[0], pitch = Math.tan(18 * Math.PI / 180), half = st.w / 2, over = 0.25, rise = half * pitch;
    const grp = new THREE.Group();
    const shape = new THREE.Shape();
    shape.moveTo(-half - over, -over * pitch); shape.lineTo(0, rise); shape.lineTo(half + over, -over * pitch);
    shape.lineTo(half + over, -over * pitch + 0.14); shape.lineTo(0, rise + 0.14); shape.lineTo(-half - over, -over * pitch + 0.14);
    const roofGeo = new THREE.ExtrudeGeometry(shape, { depth: st.d + 0.5, bevelEnabled: false });
    roofGeo.translate(0, 0, -(st.d + 0.5) / 2);
    const roof = new THREE.Mesh(roofGeo, new THREE.MeshStandardMaterial({ color: 0x1d1f24, roughness: 0.55, metalness: 0.35 }));
    roof.castShadow = true; grp.add(roof);
    const tri = (z, mat) => {
      const sh = new THREE.Shape(); sh.moveTo(-half, 0); sh.lineTo(half, 0); sh.lineTo(0, rise); sh.lineTo(-half, 0);
      const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), mat); m.position.z = z; return m;
    };
    const glass = tri(st.d / 2 - 0.05, new THREE.MeshStandardMaterial({ color: 0x2a2620, emissive: 0xffc98a, emissiveIntensity: 0.9, side: THREE.DoubleSide }));
    const back = tri(-st.d / 2 + 0.05, new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.9, side: THREE.DoubleSide }));
    grp.add(glass, back);
    const mullMat = new THREE.MeshStandardMaterial({ color: 0x111214 });
    [-2.4, -1.2, 0, 1.2, 2.4].forEach((x) => {
      const h = (half - Math.abs(x)) * pitch;
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, h, 0.06), mullMat);
      m.position.set(x, h / 2, st.d / 2 - 0.02); grp.add(m);
    });
    grp.userData.glass = glass; grp.userData.rise = rise;
    grp.visible = false; scene.add(grp); return grp;
  })();

  const spire = (() => {
    const grp = new THREE.Group();
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.18, 4.5, 8), new THREE.MeshStandardMaterial({ color: 0x9fb4d8, metalness: 0.7, roughness: 0.3 }));
    mast.position.y = 2.25; grp.add(mast);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff5a5a }));
    tip.position.y = 4.6; grp.add(tip); grp.userData.tip = tip;
    grp.visible = false; scene.add(grp); return grp;
  })();

  const rings = [];
  const ring = (y, w, good) => {
    const m = new THREE.Mesh(new THREE.RingGeometry(1, 1.12, 64),
      new THREE.MeshBasicMaterial({ color: good ? 0x58d6a0 : 0xff6b7d, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m);
    rings.push({ m, start: performance.now(), w });
  };

  const placeFloor = (r, g, animate) => {
    const st = STY[r], grp = makeFloor(st, g), y = topY;
    building.add(grp);
    const f = { grp, r, g, y, h: st.h, w: st.w, start: animate && !reduce ? performance.now() : -1e9, landed: !animate || reduce };
    grp.position.y = f.landed ? y : y + 6;
    floors.push(f); topY += st.h;
    if (f.landed && animate) ring(y + st.h / 2, st.w, g > 0);
  };
  const clearFloors = () => { floors.forEach((f) => building.remove(f.grp)); floors = []; topY = 0; };

  // ---------- Neighborhood ----------
  const hood = [];   // { grp, minRound, maxRound, s }
  const addHood = (grp, minRound, maxRound) => { grp.scale.y = 0.001; grp.visible = false; scene.add(grp); hood.push({ grp, minRound, maxRound, s: 0 }); };
  const spots = (() => {
    const r = rng(23), out = [];
    while (out.length < 26) {
      const x = (r() - 0.5) * 70, z = -6 - r() * 38 + (r() < 0.25 ? 26 : 0);
      if (Math.abs(x) < 9 && z > -9) continue;
      if (z > 4 && z < 12) continue;
      if (out.some((p) => Math.hypot(p.x - x, p.z - z) < 6.5)) continue;
      out.push({ x, z, v: r() });
    }
    return out;
  })();
  const leaf = new THREE.MeshStandardMaterial({ color: 0x16301f, roughness: 1 });
  const bark = new THREE.MeshStandardMaterial({ color: 0x2a1d16, roughness: 1 });
  const tree = (x, z, s) => {
    const g = new THREE.Group();
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 1.2), bark); t.position.y = 0.6;
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9 * s, 0), leaf); c.position.y = 1.5 * s + 0.4;
    t.castShadow = c.castShadow = true; g.add(t, c); g.position.set(x, 0, z); return g;
  };
  [[-8, 3], [8.5, 2], [-9, -4], [9.5, -5], [-12, 6], [13, 5], [-6, 12.5], [6, 12.5]].forEach(([x, z], i) => addHood(tree(x, z, 1 + (i % 3) * 0.2), 0, 9));

  const tallTex = (st, reps) => {
    const m = st.tex.map.clone(), e = st.tex.sparse.clone();
    [m, e].forEach((t) => { t.needsUpdate = true; t.repeat.set(1, reps); });
    return { m, e };
  };
  spots.forEach((p, i) => {
    const kind = i % 3;   // 0 house, 1 low-rise, 2 skyscraper
    const g = new THREE.Group();
    if (kind === 0) {
      const stucco = [0xd9cbb3, 0xe6dfd2, 0xc9b99c, 0xbfc6c3][i % 4];
      const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.6, 3.4), new THREE.MeshStandardMaterial({ color: stucco, roughness: 0.95 }));
      body.position.y = 0.8;
      const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 0.9, 4), new THREE.MeshStandardMaterial({ color: 0x5b5148, roughness: 0.9 }));
      roof.position.y = 2.05; roof.rotation.y = Math.PI / 4; roof.scale.set(1.25, 1, 0.9);
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.6), new THREE.MeshBasicMaterial({ color: p.v > 0.4 ? 0xffd58a : 0x1a2030 }));
      win.position.set(0.9, 0.9, 1.71);
      body.castShadow = roof.castShadow = true; g.add(body, roof, win);
      g.position.set(p.x, 0, p.z); g.rotation.y = (p.v - 0.5) * 0.6; addHood(g, 0, 0);
    } else {
      const st = STY[kind === 1 ? 1 : 2];
      const h = kind === 1 ? 3 + p.v * 4 : 12 + p.v * 16, w = kind === 1 ? 4 + p.v * 2 : 3.6 + p.v * 1.6;
      const t = tallTex(st, Math.max(1, Math.round(h / st.h)));
      const mat = new THREE.MeshStandardMaterial({ map: t.m, emissiveMap: t.e, emissive: new THREE.Color(st.win), emissiveIntensity: 0.35,
        roughness: st.glass ? 0.35 : 0.9, metalness: st.glass ? 0.4 : 0.05 });
      const top = new THREE.MeshStandardMaterial({ color: 0x0e1424 });
      const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, w * 0.9), [mat, mat, top, top, mat, mat]);
      box.position.y = h / 2; box.castShadow = box.receiveShadow = true; g.add(box);
      g.position.set(p.x, 0, p.z); addHood(g, kind === 1 ? 1 : 2, 9);
    }
  });

  // Golden foothills on the horizon
  {
    const hillMat = new THREE.MeshStandardMaterial({ color: 0xb88f4e, roughness: 1 });
    const oakMat = new THREE.MeshStandardMaterial({ color: 0x3b4a26, roughness: 1 });
    const r = rng(31);
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI * 0.95 + (i / 8) * Math.PI * 0.9 - Math.PI * 0.03, rad = 78 + r() * 18;
      const g = new THREE.Group();
      const hill = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2), hillMat);
      const sx = 22 + r() * 18, sy = 6 + r() * 9, sz = 12 + r() * 8;
      hill.scale.set(sx, sy, sz); g.add(hill);
      for (let k = 0; k < 6; k++) {
        const u = (r() - 0.5) * 1.4, v = (r() - 0.5) * 1.2, y = sy * Math.sqrt(Math.max(0, 1 - u * u / 1.0 - v * v / 1.0)) * 0.9;
        const oak = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9 + r() * 0.8, 0), oakMat);
        oak.position.set(u * sx * 0.7, Math.max(0.5, y), v * sz * 0.7); g.add(oak);
      }
      g.position.set(Math.cos(a) * rad, 0, Math.sin(a) * rad);
      addHood(g, 0, 0);
    }
  }
  // California fan palms
  const palmTrunk = new THREE.MeshStandardMaterial({ color: 0x8c7356, roughness: 1 });
  const palmLeaf = new THREE.MeshStandardMaterial({ color: 0x4f6f3a, roughness: 0.9, side: THREE.DoubleSide });
  const palm = (x, z, h) => {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.2, h, 7), palmTrunk);
    trunk.position.y = h / 2; trunk.castShadow = true; g.add(trunk);
    for (let i = 0; i < 11; i++) {
      const pivot = new THREE.Object3D(); pivot.position.y = h; pivot.rotation.y = (i / 11) * Math.PI * 2;
      const frond = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.04, 0.42), palmLeaf);
      frond.position.x = 0.85; frond.rotation.z = -0.32 - (i % 3) * 0.12; frond.castShadow = true;
      pivot.add(frond); g.add(pivot);
    }
    g.position.set(x, 0, z); return g;
  };
  [[-20, 10.6, 8.5], [-11, 10.6, 9.5], [-2, 10.8, 8], [7, 10.6, 9], [16, 10.6, 8.5], [25, 10.7, 9.5],
   [-10.5, 3.5, 7.5], [10.5, 4.5, 8.5], [-22, -12, 9], [20, -16, 8]].forEach(([x, z, h]) => addHood(palm(x, z, h), 0, 0));

  const cars = [0, 1].map((i) => {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.42, 0.55), new THREE.MeshStandardMaterial({ color: i ? 0x3a2a4a : 0x24324f, roughness: 0.6 }));
    body.position.y = 0.32;
    const cab = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.5), new THREE.MeshStandardMaterial({ color: 0x0d1220 }));
    cab.position.set(-0.05, 0.62, 0);
    const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff1c8 });
    [-0.18, 0.18].forEach((z) => { const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.08, 0.1), lampMat); l.position.set(0.56, 0.36, z); g.add(l); });
    g.add(body, cab); g.position.set(0, 0, i ? 8.9 : 7.1); g.rotation.y = i ? Math.PI : 0;
    g.visible = false; scene.add(g); return g;
  });

  // ---------- Fireworks ----------
  const bursts = [];
  const COLORS = [0xff7a59, 0x5cc8ff, 0xffc857, 0xc58bff, 0x58d6a0];
  let lastBurst = 0;
  const burst = (now) => {
    const r = Math.random, n = 70, pos = new Float32Array(n * 3), vel = [];
    const o = new THREE.Vector3((r() - 0.5) * 14, topY + 6 + r() * 6, (r() - 0.5) * 8);
    for (let i = 0; i < n; i++) {
      const th = r() * Math.PI * 2, ph = Math.acos(2 * r() - 1), s = 4 + r() * 2.5;
      vel.push(new THREE.Vector3(Math.sin(ph) * Math.cos(th) * s, Math.cos(ph) * s, Math.sin(ph) * Math.sin(th) * s));
      pos.set([o.x, o.y, o.z], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: COLORS[(r() * COLORS.length) | 0], size: 0.35, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    scene.add(pts); bursts.push({ pts, o, vel, start: now });
  };

  // ---------- Camera and input ----------
  let theta = 0.6, thetaGoal = 0.6, lastInput = -1e9;
  const look = { y: 2, d: 22 };
  let dragging = false, lastX = 0;
  cv.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastInput = performance.now(); cv.style.cursor = "grabbing"; });
  window.addEventListener("pointerup", () => { dragging = false; cv.style.cursor = ""; });
  cv.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    thetaGoal -= (e.clientX - lastX) * 0.01; lastX = e.clientX; lastInput = performance.now();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
    thetaGoal += e.key === "ArrowLeft" ? 0.45 : -0.45; lastInput = performance.now();
  });

  const resize = () => {
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
  };
  if (window.ResizeObserver) new ResizeObserver(resize).observe(host); else window.addEventListener("resize", resize);
  resize();

  // ---------- State from the game ----------
  let round = 0, done = false, ready = false, settingReady = false;
  function update(st) {
    const same = st.floors.length >= floors.length && floors.every((f, i) => f.r === st.floors[i].r && f.g === st.floors[i].g);
    if (!same) clearFloors();
    const animate = ready && same;
    for (let i = floors.length; i < st.floors.length; i++) placeFloor(st.floors[i].r, st.floors[i].g, animate);
    ready = true;

    if (st.round !== round || !settingReady) {
      setFrom = settingReady && !reduce ? {
        top: cur.top.clone(), mid: cur.mid.clone(), hor: cur.hor.clone(), fog: cur.fog.clone(), groundC: cur.groundC.clone(),
        sun: cur.sun.clone(), hs: cur.hs.clone(), hg: cur.hg.clone(), sunI: cur.sunI, hI: cur.hI, stars: cur.stars, sunPos: cur.sunPos.toArray()
      } : null;
      setTo = SETTINGS[Math.min(st.round, 2)];
      setStart = settingReady && !reduce ? performance.now() : -1e9;
      settingReady = true;
      applySetting(setFrom ? 0 : 1);
    }
    round = st.round; done = st.done;
    ghostOn = st.next === null ? -1 : st.next;
    ghosts.forEach((g, i) => { g.grp.visible = i === ghostOn; g.grp.position.y = topY; });

    const topSt = floors.length ? STY[floors[floors.length - 1].r] : null;
    sign.visible = !!topSt;
    const capOn = topSt === STY[0] && (ghostOn === 0 || ghostOn === -1);
    roofCap.visible = capOn;
    roofCap.userData.targetY = topY + (ghostOn === 0 ? STY[0].h + 0.15 : 0);
    if (!roofCap.userData.placed || reduce) { roofCap.position.y = roofCap.userData.targetY; roofCap.userData.placed = capOn; }
    if (topSt) {
      if (capOn) sign.position.set(0, topY - 0.55, topSt.d / 2 + 0.75);
      else sign.position.set(0, topY, topSt.d / 2 - 0.35);
    }
    spire.visible = done; spire.position.y = topY;
    cars.forEach((c) => (c.visible = round >= 1));

    const n = floors.length, label = STY[Math.min(round, 2)].name;
    cap.textContent = `HQ · ${label} · ${n} ${n === 1 ? "floor" : "floors"}`;
    cv.setAttribute("aria-label", `3D view of Kestrel's headquarters: ${label.toLowerCase()}, ${n} ${n === 1 ? "floor" : "floors"}. One floor is added for every case you answer.`);
  }

  // ---------- Loop ----------
  let prev = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;

    floors.forEach((f) => {
      if (f.landed) return;
      const k = ease((now - f.start) / 700);
      f.grp.position.y = f.y + 6 * (1 - k);
      if (k >= 1) { f.landed = true; f.grp.position.y = f.y; ring(f.y + f.h / 2, f.w, f.g > 0); }
    });
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i], k = (now - r.start) / 900;
      if (k >= 1) { scene.remove(r.m); rings.splice(i, 1); continue; }
      const s = r.w * (0.6 + ease(k) * 0.9); r.m.scale.set(s, s, s); r.m.material.opacity = 1 - k;
    }
    if (ghostOn >= 0) {
      const a = reduce ? 0.8 : 0.45 + 0.4 * Math.sin(now / 320);
      ghosts[ghostOn].edges.material.opacity = a;
    }
    if (setFrom && now - setStart < 1900) applySetting(ease((now - setStart) / 1800));
    else if (setFrom) { applySetting(1); setFrom = null; }
    if (roofCap.visible) roofCap.position.y += (roofCap.userData.targetY - roofCap.position.y) * Math.min(1, dt * 5);
    hood.forEach((h) => {
      const want = round >= h.minRound && round <= h.maxRound ? 1 : 0;
      h.s += (want - h.s) * (reduce ? 1 : Math.min(1, dt * 3));
      h.grp.visible = h.s > 0.01; h.grp.scale.y = Math.max(0.001, h.s);
    });
    cars.forEach((c, i) => { if (!c.visible) return; const sp = (i ? -1 : 1) * 7; c.position.x = (((c.position.x + sp * dt) + 60) % 120 + 120) % 120 - 60; });
    if (spire.visible) spire.userData.tip.visible = reduce || Math.floor(now / 600) % 2 === 0;

    if (done && !reduce && now - lastBurst > 900) { burst(now); lastBurst = now; }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i], t = (now - b.start) / 1000;
      if (t > 1.8) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); continue; }
      const a = b.pts.geometry.attributes.position;
      b.vel.forEach((v, j) => a.setXYZ(j, b.o.x + v.x * t, b.o.y + v.y * t - 4.9 * t * t * 0.6, b.o.z + v.z * t));
      a.needsUpdate = true; b.pts.material.opacity = 1 - t / 1.8;
    }

    if (!reduce && !dragging && now - lastInput > 3500) thetaGoal += dt * 0.12;
    theta += (thetaGoal - theta) * Math.min(1, dt * 6);
    const H = topY + (spire.visible ? 4.5 : 0);
    const wantY = Math.max(2, H * 0.5), wantD = Math.max(21, H * 1.35 + 13);
    const blend = reduce ? 1 : Math.min(1, dt * 2.5);
    look.y += (wantY - look.y) * blend; look.d += (wantD - look.d) * blend;
    cam.position.set(Math.sin(theta) * look.d, look.y + look.d * 0.32, Math.cos(theta) * look.d);
    cam.lookAt(0, look.y, 0);

    R.render(scene, cam);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  return { update };
})();
</script>
<script>
const ROUNDS = [
  {name:"Seed", raise:"$2M", lead:"Northlight Ventures", blurb:"Four founders, one laptop each, and a model that works. Get the company fundable."},
  {name:"Series A", raise:"$15M", lead:"Northlight Ventures", blurb:"Forty employees, real customers, and investors who now require audited financials."},
  {name:"IPO", raise:"$300M", lead:"Public markets", blurb:"Bankers are circling. Every number you report is about to be public."}
];
const SEC = {FAR:"var(--far)", AUD:"var(--aud)", REG:"var(--reg)"};
const CASES = [
 {
  "id": "reg-001",
  "r": 0,
  "sec": "REG",
  "topic": "Entity choice",
  "from": "Maya, CEO",

  "tip": "S corp limits: 100 shareholders, one class of stock, no partnership, corporate or nonresident alien shareholders.",
  "opts": [
   "S corporation, to keep one level of tax",

  ],
  "ans": 1
 },
 {
  "id": "reg-005",
  "r": 0,
  "sec": "REG",
  "topic": "Self-employment tax",
  "from": "Dev, CTO",
  "msg": "Before Kestrel, I spent last year consulting on my own as a sole proprietor. I netted $100,000 and paid $14,130 of self-employment tax on top of income tax. Friends with regular jobs only have half that much taken out of their paychecks, and their employers pay the other half and deduct it. Can I deduct any of mine on my personal return?",
  "q": "How does Dev treat the self-employment tax on his individual return?",
  "type": "mcq",
  "why": "Self-employment tax covers both the employee and the employer shares of Social Security and Medicare. An employer deducts its half as a business expense, so a self-employed person gets the same treatment for the employer-equivalent half: $14,130 / 2 = $7,065, deducted as an adjustment to income. Because it is above the line, it lowers AGI whether or not Dev itemizes.",
  "tip": "Treat the self-employed person as both employer and employee. The employer half is an adjustment to income. The employee half is not deductible, just as an employee cannot deduct FICA withheld from a paycheck.",
  "opts": [
   "He cannot deduct any of it, because it is a personal tax",
   "He deducts half, $7,065, as an adjustment to income",
   "He deducts all $14,130 as an itemized deduction",
   "He deducts half, $7,065, as an itemized deduction"
  ],
  "ans": 1
 },
 {

  "type": "mcq",

 {

  "msg": "Bad news before year-end. A former contractor is suing us, claiming our model was trained on code he wrote. Our lawyers think we will probably lose. Their estimate of the damages is anywhere from $200,000 to $500,000, and they say no amount in that range is more likely than any other. The financial statements are due to the auditors next week.",

  "type": "num",
  "why": "A loss contingency is accrued when a loss is probable and the amount can be reasonably estimated. Both tests are met. When the estimate is a range and no amount in it is a better estimate than any other, US GAAP requires accruing the minimum: $200,000 (debit Litigation Loss, credit Accrued Litigation Liability). The reasonably possible additional loss of up to $300,000 is disclosed in the notes.",
  "tip": "Probable and estimable: accrue. Best estimate in a range: accrue it. No best estimate: accrue the low end and disclose the rest. Reasonably possible: disclose only. Remote: nothing. Gain contingencies are never accrued.",

 },
 {

  "q": "What lease liability goes on the balance sheet at commencement?",
  "type": "num",
  "why": "The liability is the present value of the payments: $100,000 x 4.2124 = $421,240. With no prepaid rent or initial direct costs, the right-of-use asset starts at the same amount.",
  "tip": "ASC 842: lessees put both operating and finance leases on the balance sheet. Only short-term leases (12 months or less) can stay off.",
  "ans": 421240,
  "tol": 60
 },
 {
  "id": "reg-006",
  "r": 1,
  "sec": "REG",
  "topic": "Basis of business property",
  "from": "Dev, CTO",
  "msg": "We bought our first GPU server cluster. The price was $400,000, plus $32,000 of sales tax, $8,000 of freight to get it here, and $15,000 for the electricians and installers who got it running. We also bought a $20,000 one-year support contract. What is our tax basis in the cluster?",
  "q": "What is Kestrel's depreciable basis in the server cluster?",
  "type": "num",
  "why": "Basis is the cost of acquiring the asset and getting it ready for its intended use: $400,000 price + $32,000 sales tax + $8,000 freight + $15,000 installation = $455,000. The support contract pays for a year of service after the cluster is running, so it is a separate operating cost and does not go into basis.",
  "tip": "Basis = everything paid to acquire an asset and make it ready to use. Costs that keep it running afterward, like repairs, maintenance or support, are expenses. Basis is the starting point for depreciation and for gain or loss when the asset is sold.",
  "ans": 455000,
  "tol": 0
 },
 {
  "id": "aud-002",
  "r": 1,
  "sec": "AUD",
  "topic": "Audit risk model",

  "q": "How does the audit team respond?",

  "why": "Audit risk = risk of material misstatement x detection risk. When the first part is high, the auditor must hold detection risk low, which means more evidence: larger samples, more reliable procedures, and testing closer to year-end.",

  "opts": [
   "Accept higher detection risk and do less substantive testing",
   "Set detection risk lower and do more substantive testing",
   "Raise materiality so fewer items need testing",
   "Rely on controls testing instead of substantive procedures"
  ],
  "ans": 1
 },
 {
  "id": "far-004",
  "r": 2,
  "sec": "FAR",
  "topic": "Revenue allocation",
  "from": "Maya, CEO",

  "q": "How much of the price is allocated to implementation?",

  "why": "Allocate the transaction price by relative standalone selling price. Implementation is 90,000 of 360,000, or 25%, so it gets $300,000 x 25% = $75,000. The subscription gets $225,000.",

  "ans": 75000,

 },
 {
  "id": "aud-003",
  "r": 2,
  "sec": "AUD",
  "topic": "Revenue fraud",
  "from": "Sam, audit senior",
  "msg": "Sales booked a $900,000 contract on December 31. I'm hearing there may be a side letter that lets the customer cancel through March.",

  "why": "A side letter lives outside the accounting records, so evidence from the customer is the most direct way to find it. Tracing from delivery records to sales tests completeness, which is the wrong direction for overstated revenue.",

   "Recalculate the invoice math",
   "Trace delivery records forward to recorded sales",
   "Confirm contract terms, including side agreements, with the customer",
   "Compare this year's gross margin with last year's"
  ],

 },
 {
  "id": "reg-004",
  "r": 2,
  "sec": "REG",
  "topic": "Net operating losses",
  "from": "Maya, CEO",
  "msg": "We finally made money. Taxable income before any loss deduction is $2,000,000, and we're carrying $5,000,000 of net operating losses from the last few years. So no tax, right?",
  "q": "What is Kestrel's federal income tax for the year?",
  "type": "num",
  "why": "Losses from years after 2017 can offset only 80% of taxable income: $1,600,000. That leaves $400,000 taxed at 21%, which is $84,000. The remaining $3,400,000 carries forward indefinitely.",

  "ans": 84000,
  "tol": 0
 },
 {
  "id": "aud-004",
  "r": 2,
  "sec": "AUD",
  "topic": "Integrated audit",
  "from": "Sam, audit senior",
  "msg": "Last one before the filing. The financial statements are fairly presented, but we found a material weakness in internal control over financial reporting that still existed at year-end. Assume the integrated audit applies.",
  "q": "What opinions does the auditor issue?",
  "type": "mcq",
  "why": "The two opinions are separate. A material weakness at the reporting date requires an adverse opinion on internal control, even when the auditor did enough extra work to conclude the statements themselves are fairly stated.",
  "tip": "PCAOB integrated audit: any material weakness at year-end means an adverse ICFR opinion. A scope limitation leads to a disclaimer or withdrawal.",
  "opts": [
   "Unmodified on the statements, adverse on internal control",
   "Qualified on both",
   "Adverse on both",
   "Unmodified on both, with an emphasis paragraph"
  ],
  "ans": 0
 }
];
const MAX = CASES.length * 100;
const UNICORN_AT = Math.round(MAX * 5 / 6);
const roundMax = (r) => CASES.filter(c => c.r === r).length * 100;

let S;
const fresh = () => ({phase:"intro",tab:"play",i:0,pts:[],tries:0,solved:false,pick:null,dr:null,cr:null,active:"dr",note:null,trust:70});
const $ = (id) => document.getElementById(id);
const sum = (a) => a.reduce((x, y) => x + y, 0);
const ptsIn = (r) => sum(CASES.map((c, k) => c.r === r ? (S.pts[k] || 0) : 0));
const total = () => sum(S.pts.map(p => p || 0));
const round = () => S.phase === "done" ? 2 : CASES[Math.min(S.i, CASES.length - 1)].r;
function valuation(){
  const r = round();
  if (r === 0) return 6 + 0.015 * ptsIn(0);
  if (r === 1) return 40 + 0.15 * ptsIn(1);
  return 300 + 0.7 * total();
}
const fmtVal = (m) => m >= 1000 ? "$" + (m / 1000).toFixed(2) + "B" : "$" + m.toFixed(1) + "M";
const usd = (n) => "$" + n.toLocaleString("en-US");

function chrome(){
  const r = round();
  $("stages").innerHTML = ROUNDS.map((x, k) => `<span class="${S.phase === "done" || k < r ? "done" : k === r ? "on" : ""}">${x.name}</span>`).join("");
  $("val").textContent = fmtVal(valuation());
  $("trustN").textContent = S.trust;
  $("trustB").style.width = S.trust + "%";
  $("trustB").style.setProperty("--c", S.trust >= 60 ? "var(--good)" : S.trust >= 35 ? "var(--aud)" : "var(--bad)");
  ["play","score"].forEach(v => $("tab-" + v).setAttribute("aria-selected", String(S.tab === v)));
}

function answerUI(c){
  if (c.type === "mcq") return `<div class="opts">${c.opts.map((o, k) => {
    const cls = S.solved ? (k === c.ans ? " right" : k === S.pick ? " wrong" : "") : "";
    return `<button class="opt${cls}" data-act="mcq" data-v="${k}" ${S.solved ? "disabled" : ""}>${o}</button>`;}).join("")}</div>`;
  if (c.type === "num") return S.solved ? `<p class="mono">Answer: ${usd(c.ans)}</p>` : `
    <form class="numrow" id="numform"><label for="numin">$<input id="numin" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Amount in dollars"></label><button class="btn" type="submit">Submit</button></form>`;
  const slot = (side) => `<button class="slot ${side}${S.active === side && !S.solved ? " on" : ""}" data-act="slot" data-v="${side}" ${S.solved ? "disabled" : ""}>${S[side] || `<em>Pick the ${side === "dr" ? "debit" : "credit"} account</em>`}</button>`;
  return `<table class="je" aria-label="Journal entry"><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>
    <tr><td>${slot("dr")}</td><td class="n">${c.amt.toLocaleString("en-US")}</td><td class="n"></td></tr>
    <tr><td>${slot("cr")}</td><td class="n"></td><td class="n">${c.amt.toLocaleString("en-US")}</td></tr></table>` +
    (S.solved ? "" : `<div class="chips">${c.accts.map(a => `<button class="chip${S.dr === a || S.cr === a ? " sel" : ""}" data-act="pick" data-v="${a}">${a}</button>`).join("")}</div>
    <div class="row"><button class="btn" data-act="post" ${S.dr && S.cr ? "" : "disabled"}>Post entry</button></div>`);
}

function viewPlay(){
  if (S.phase === "intro") return `<section class="panel">
    <span class="tag" style="--c:var(--accent)">CPA CORE: FAR + AUD + REG</span>
    <h1>Take an AI startup from seed round to IPO.</h1>
    <p>You are the first finance hire at Kestrel AI. Founders, investors and auditors will message you with real problems. Every call you make moves the valuation.</p>
    <ol class="how">
      <li><b>${CASES.length} cases</b> across three funding rounds.</li>
      <li>Each is tagged <b style="color:var(--far)">FAR</b>, <b style="color:var(--aud)">AUD</b> or <b style="color:var(--reg)">REG</b> and ends with the exam takeaway.</li>
      <li>Score ${UNICORN_AT.toLocaleString("en-US")} of ${MAX.toLocaleString("en-US")} points to list at a <b>$1B valuation</b>.</li>
    </ol>
    <div class="row"><button class="btn" data-act="start">Start the seed round</button></div>
    <p class="dim">Kestrel AI and everyone in it are fictional. Rules shown are US GAAP, AICPA and PCAOB standards, and federal tax law.</p></section>`;
  if (S.phase === "close") return viewClose();
  if (S.phase === "done") return viewDone();
  const c = CASES[S.i], got = S.pts[S.i];
  let after = "";
  if (S.solved) after = `
    <div class="verdict ${got ? "good" : "bad"}">${got === 100 ? "Correct. +100" : got ? "Correct on the second try. +50" : "Missed. +0"}</div>
    <div class="fb ${got ? "good" : "bad"}"><b>Why:</b> ${c.why}</div>
    <div class="fb tip"><b>Exam takeaway:</b> ${c.tip}</div>
    <div class="row"><button class="btn" data-act="next">${S.i + 1 < CASES.length && CASES[S.i + 1].r === c.r ? "Next case" : c.r === 2 ? "Ring the bell" : "Close the " + ROUNDS[c.r].name + " round"}</button></div>`;
  else if (S.note) after = `<div class="fb bad" role="status">${S.note}</div>`;
  return `<section class="panel">
    <div class="headrow"><span class="tag" style="--c:${SEC[c.sec]}">${c.sec} &middot; ${c.topic}</span><span class="dim mono">${S.i + 1}/${CASES.length}</span></div>
    <div class="msg"><b>${c.from}</b>${c.msg}</div>
    <p class="q">${c.q}</p>
    ${answerUI(c)}${after}</section>`;
}

function viewClose(){
  const r = CASES[S.i].r - 1, R = ROUNDS[r], p = ptsIn(r), next = ROUNDS[r + 1];
  const v = r === 0 ? 6 + 0.015 * p : 40 + 0.15 * p;
  return `<section class="panel deal">
    <span class="tag" style="--c:var(--accent)">TERM SHEET SIGNED</span>
    <h2>${R.name} round closed</h2>
    <div class="big">${fmtVal(v)}</div>
    <div class="kv"><span>Raised</span><b>${R.raise}</b><span>Lead investor</span><b style="font-family:var(--body)">${R.lead}</b><span>Round score</span><b>${p} / ${roundMax(r)}</b></div>
    <p>${p >= roundMax(r) * .875 ? "Clean diligence. The lead investor said your books were the easiest part of the deal." : p >= roundMax(r) * .5 ? "The round closed, but diligence found gaps and the price reflects it." : "The round barely closed. Investors priced in the cleanup work."}</p>
    <h3>Next: ${next.name}</h3><p class="dim">${next.blurb}</p>
    <div class="row"><button class="btn" data-act="open">Start ${next.name}</button></div></section>`;
}

function secStats(){
  return Object.keys(SEC).map(s => {
    const ks = CASES.map((c, k) => c.sec === s ? k : -1).filter(k => k >= 0);
    const done = ks.filter(k => S.pts[k] !== undefined);
    return {s, got: sum(done.map(k => S.pts[k])), of: done.length * 100, all: ks.length * 100};
  });
}
function secBars(){
  return secStats().map(x => `<div class="sec"><span class="tag" style="--c:${SEC[x.s]}">${x.s}</span><div class="bar"><b style="width:${x.of ? 100 * x.got / x.of : 0}%;--c:${SEC[x.s]}"></b></div><span class="mono dim">${x.got}/${x.of || x.all}</span></div>`).join("");
}

function viewDone(){
  const t = total(), uni = t >= UNICORN_AT, v = uni ? Math.max(1000, 300 + 0.7 * t) : Math.min(990, 300 + 0.7 * t);
  const weak = secStats().sort((a, b) => a.got / a.of - b.got / b.of)[0];
  const missed = CASES.filter((c, k) => S.pts[k] < 100);
  return `<section class="panel deal">
    <span class="tag" style="--c:var(--accent)">${uni ? "UNICORN" : "LISTED"}</span>
    <h2>${uni ? "Kestrel AI opens above a billion dollars." : "Kestrel AI is public, short of unicorn status."}</h2>
    <div class="big">${fmtVal(v)}</div>
    <div class="kv"><span>Total score</span><b>${t} / ${MAX}</b><span>Board trust</span><b>${S.trust}</b></div>
    ${secBars()}
    <p>${t === MAX ? "A perfect record across all three sections." : `Your weakest section was <b>${weak.s}</b>. Review these before you replay:`}</p>
    ${missed.length ? `<div class="list">${missed.map(c => `<div class="item"><span class="tag" style="--c:${SEC[c.sec]}">${c.sec}</span><span>${c.topic}<br><span class="dim">${c.tip}</span></span><span></span></div>`).join("")}</div>` : ""}
    <div class="row"><button class="btn" data-act="again">Play again</button></div></section>`;
}

function viewScore(){
  const rows = CASES.map((c, k) => S.pts[k] === undefined ? "" : `<div class="item"><span class="tag" style="--c:${SEC[c.sec]}">${c.sec}</span><span>${c.topic}</span><span class="mono" style="color:${S.pts[k] === 100 ? "var(--good)" : S.pts[k] ? "var(--aud)" : "var(--bad)"}">+${S.pts[k]}</span></div>`).join("");
  return `<section class="panel"><div class="headrow"><h2>Scorecard</h2><span class="mono">${total()} pts</span></div>
    <p class="dim">Points earned out of points attempted, by CPA section.</p>${secBars()}
    ${rows ? `<h3>Cases</h3><div class="list">${rows}</div>` : `<p class="dim">Answer your first case on the Desk tab to see results here.</p>`}</section>`;
}

function hqState(){
  const floors = [];
  for (let k = 0; k < CASES.length && S.pts[k] !== undefined; k++) floors.push({r: CASES[k].r, g: S.pts[k] === 100 ? 2 : S.pts[k] ? 1 : 0});
  const next = S.phase === "done" || floors.length >= CASES.length ? null : CASES[floors.length].r;
  return {floors, next, round: round(), done: S.phase === "done"};
}
function render(){
  chrome();
  $("view").innerHTML = S.tab === "score" ? viewScore() : viewPlay();
  try { window.HQ && window.HQ.update(hqState()); } catch (e) { console.error(e); }
}

function settle(points){
  S.pts[S.i] = points; S.solved = true; S.note = null;
  S.trust = Math.max(0, Math.min(100, S.trust + (points === 100 ? 4 : points ? 1 : -10)));
}
function grade(ok, c){
  if (ok) return settle(S.tries === 0 ? 100 : 50);
  S.tries++;
  if (c.type === "mcq" || S.tries >= 2) { if (c.type === "je") { S.dr = c.dr; S.cr = c.cr; } return settle(0); }
  S.note = c.type === "num" ? "Not quite. Check the method and try once more for 50 points." : (S.dr === c.cr && S.cr === c.dr ? "Right accounts, wrong sides. One more try for 50 points." : "Not quite. Has Kestrel earned this cash yet? One more try for 50 points.");
}

function act(a, d){
  const c = CASES[S.i];
  if (a === "tab") S.tab = d.v;
  else if (a === "start") S.phase = "play";
  else if (a === "again") { S = fresh(); S.phase = "play"; }
  else if (a === "open") S.phase = "play";
  else if (a === "mcq" && !S.solved) { S.pick = +d.v; grade(S.pick === c.ans, c); }
  else if (a === "num" && !S.solved) {
    const n = parseFloat(String(d.v).replace(/[^0-9.\-]/g, ""));
    if (isNaN(n)) S.note = "Enter a dollar amount, for example 125000."; else grade(Math.abs(n - c.ans) <= c.tol, c);
  }
  else if (a === "slot") { S[d.v] = null; S.active = d.v; }
  else if (a === "pick") {
    if (S.dr === d.v) { S.dr = null; S.active = "dr"; }
    else if (S.cr === d.v) { S.cr = null; S.active = "cr"; }
    else { S[S.active] = d.v; S.active = S.active === "dr" ? (S.cr ? "dr" : "cr") : (S.dr ? "cr" : "dr"); }
  }
  else if (a === "post" && S.dr && S.cr) grade(S.dr === c.dr && S.cr === c.cr, c);
  else if (a === "next") {
    const prev = c.r;
    S.i++; S.tries = 0; S.solved = false; S.pick = null; S.dr = S.cr = null; S.active = "dr"; S.note = null;
    if (S.i >= CASES.length) S.phase = "done"; else if (CASES[S.i].r !== prev) S.phase = "close";
    window.scrollTo(0, 0);
  }
  render();
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (el && !el.disabled) act(el.dataset.act, el.dataset);
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "numform") act("num", {v: $("numin").value});
});

function start(saved){ S = Object.assign(fresh(), saved && saved.phase ? saved : {}); render(); }
window.claude?.hot?.snapshot?.(() => S);
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
