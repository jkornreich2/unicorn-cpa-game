<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footnote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: an auditor's workpaper. Graph-paper sheet, red-pencil tickmarks, superscript footnote numbers. Single light theme by choice. */
  color-scheme: light;
  --paper:#f4f6f1;
  --grid:#dde5dc;
  --ink:#16202e;
  --dim:#5c6878;
  --red:#c8102e;      /* red pencil: tickmarks and the deepest tier */
  --blue:#1f4fa8;     /* blue pencil */
  --rule:#b9c6bb;
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --t0:#3a3f47; --t1:#e9ece6; --t2:#4d7fd6; --t3:#2f9e6a; --t4:#e3b23c; --t5:#e2742f; --t6:#c8102e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.logo{font-family:var(--display);font-size:38px;line-height:1;letter-spacing:-.01em}
.logo sup{font-family:var(--mono);font-size:14px;color:var(--red);margin-left:2px}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h1{font-family:var(--display);font-size:44px;line-height:1.02}
h2{font-family:var(--display);font-size:32px;line-height:1.05}
h3{font-family:var(--body);font-size:15px;font-weight:600}
p{margin:0}
.dim{color:var(--dim);font-size:14.5px}
.card{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:18px 16px;box-shadow:0 1px 0 var(--rule);display:flex;flex-direction:column;gap:14px}
.btn{min-height:50px;border-radius:4px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;padding:10px 18px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.sec{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;padding:3px 8px;border-radius:3px;color:#fff}
.sec.FAR{background:var(--blue)} .sec.AUD{background:#7a4fb0} .sec.REG{background:#2f7d5a}
.tiers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tiers div{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tiers i{display:block;height:10px;border-radius:2px;margin-bottom:4px}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Prompt screen */
.prog{display:flex;gap:4px}
.prog span{flex:1;height:6px;border-radius:2px;background:var(--grid)}
.prog span.done{background:var(--ink)} .prog span.now{background:var(--red)}
.qhead{display:flex;justify-content:space-between;align-items:center}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.timer.low{color:var(--red)}
.bar{height:4px;background:var(--grid);border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform .2s linear}
.prompt{font-family:var(--display);font-size:36px;line-height:1.08}
.prompt sup{font-family:var(--mono);font-size:15px;color:var(--red);vertical-align:super}
form.ans{display:flex;gap:8px}
form.ans input{flex:1;min-width:0;height:54px;border:2px solid var(--ink);border-radius:4px;padding:0 14px;background:#fff;font-size:18px}
form.ans .btn{flex:none}

/* Result */
.verdict{display:flex;align-items:center;gap:14px}
.tick{font-family:var(--display);font-size:56px;line-height:1;color:var(--red);width:56px;text-align:center}
.verdict .pts{font-family:var(--mono);font-size:28px;font-weight:600}
.tierchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tierchip i{width:12px;height:12px;border-radius:2px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.notes li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px dashed var(--rule);font-size:15px}
.notes li b{font-weight:600}
.notes li small{display:block;color:var(--dim);font-size:13.5px;margin-top:2px}
.notes li .p{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.notes li .n{font-family:var(--mono);font-size:11px;color:var(--red)}

/* Summary */
.score{font-family:var(--display);font-size:84px;line-height:.9}
.squares{font-size:26px;letter-spacing:2px}
.depth{font-family:var(--mono);font-size:13px;color:var(--dim)}
.share{font-family:var(--mono);font-size:13px;white-space:pre-wrap;background:var(--paper);border:1px dashed var(--rule);padding:10px;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:22px}
.stats span{font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:3px 8px;border-radius:3px;border:1px solid var(--rule);background:var(--paper)}
.fuse{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--red)}
.fuse i{width:14px;height:14px;border-radius:50%;background:var(--red);animation:tick 1s infinite}
@keyframes tick{50%{transform:scale(.55);opacity:.4}}
@media (prefers-reduced-motion:reduce){.fuse i{animation:none}}
.players{display:flex;flex-direction:column;gap:8px}
.players input{height:46px;border:1px solid var(--rule);border-radius:4px;padding:0 12px;background:#fff}
.board{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:14.5px}
.board .out{color:var(--dim);text-decoration:line-through}
.big{font-family:var(--display);font-size:40px;line-height:1.05}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:14px}
@media (max-width:380px){h1{font-size:36px}.prompt{font-size:30px}.score{font-size:68px}}
@media (prefers-reduced-motion:reduce){.bar b{transition:none}}
</style>
</head>

// ---------- Matching ----------
const norm = (s) => (" " + s.toLowerCase().replace(/&/g, " and ").replace(/['’.]/g, "").replace(/[^a-z0-9]+/g, " ") + " ")
  .replace(/ (the|a|an) /g, " ").trim();
const sing = (s) => s.split(" ").map((w) => (w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w)).join(" ");
const lev = (a, b) => {                 // edit distance where swapping two neighboring letters counts as one typo
  if (Math.abs(a.length - b.length) > 3) return 9;
  const D = Array.from({ length: a.length + 1 }, (_, i) => Array.from({ length: b.length + 1 }, (_, j) => (i ? (j ? 0 : i) : j)));
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) D[i][j] = Math.min(D[i][j], D[i - 2][j - 2] + 1);
  }
  return D[a.length][b.length];
};
function match(prompt, raw) {
  const x = sing(norm(raw));
  if (!x) return null;
  let best = null, bestScore = 99;
  prompt.a.forEach((ans, idx) => {
    ans[2].split("|").forEach((al) => {
      const y = sing(norm(al));
      let s = 99;
      if (x === y) s = 0;
      else if (y.length >= 5 && (" " + x + " ").includes(" " + y + " ")) s = 1;
      else if (x.length >= 6 && (" " + y + " ").includes(" " + x + " ") && x.length >= y.length * 0.6) s = 1.5;
      else if (y.length >= 5) { const d = lev(x, y); if (d <= (y.length >= 10 ? 2 : 1)) s = 2 + d; }
      if (s < bestScore || (s === bestScore && best !== null && ans[0] > prompt.a[best][0])) { bestScore = s; best = idx; }
    });
  });
  return bestScore < 99 ? best : null;
}

// ---------- Daily selection ----------
const EPOCH = Date.UTC(2026, 10, 17);           // Footnote #1 = Nov 17, 2026
const easternYMD = () => {
  try {
    const f = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
    const g = (t) => +f.find((x) => x.type === t).value; return [g("year"), g("month") - 1, g("day")];
  } catch (e) { const n = new Date(); return [n.getFullYear(), n.getMonth(), n.getDate()]; }
};
const today = () => { const [y, m, d] = easternYMD(); return Math.floor((Date.UTC(y, m, d) - EPOCH) / 864e5) + 1; };
const dayDate = (n) => new Date(EPOCH + (n - 1) * 864e5).toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
const rng = (seed) => { let s = (seed * 2654435761) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };
function pick(seed) {
  const r = rng(seed), bySec = { FAR: [], AUD: [], REG: [] };
  PROMPTS.forEach((p) => bySec[p.sec].push(p));
  Object.values(bySec).forEach((arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } });
  const order = ["FAR", "AUD", "REG", "FAR", "REG", "AUD", "FAR"], take = { FAR: 0, AUD: 0, REG: 0 };
  return order.map((s) => bySec[s][take[s]++ % bySec[s].length]);
}

function newDive(mode, opt) {
  const day = mode === "archive" ? opt : today();
  let prompts;
  if (mode === "daily" || mode === "archive") prompts = pick(day);
  else {
    const pool = PROMPTS.filter((p) => !opt || opt === "MIX" || p.sec === opt).slice(), r = rng(Math.floor(Math.random() * 1e9));
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    prompts = pool.slice(0, Math.min(PER, pool.length));
  }
  G = { mode, day, pack: opt, prompts, i: 0, results: [], phase: "prompt", left: SECONDS, started: Date.now() };
  startPrompt();
}
function startPrompt() {
  G.phase = "prompt"; G.left = SECONDS; G.deadline = Date.now() + SECONDS * 1000;
  render();
  clearInterval(timer);
  timer = setInterval(() => {
    G.left = Math.max(0, Math.ceil((G.deadline - Date.now()) / 1000));
    const t = $("timer"), b = $("tbar");
    if (t) { t.textContent = G.left; t.classList.toggle("low", G.left <= 5); }
    if (b) b.style.transform = `scaleX(${G.left / SECONDS})`;
    if (G.left <= 0) submit("");
  }, 200);
}
function submit(raw) {
  if (G.phase !== "prompt") return;
  clearInterval(timer);
  const p = G.prompts[G.i], idx = raw.trim() ? match(p, raw) : null;
  const tier = idx === null ? 0 : p.a[idx][0];
  G.results.push({ id: p.id, raw: raw.trim(), idx, tier, pts: TIERS[tier].pts, timeout: !raw.trim(), gem: idx !== null && p.a[idx][4] === 1 });
  G.phase = "result";
  render();
}
function next() {
  G.i++;
  if (G.i < G.prompts.length) return startPrompt();
  G.phase = "done";
  const total = G.results.reduce((s, r) => s + r.pts, 0);
  if (G.mode === "daily" || G.mode === "archive") store.set("day:" + G.day, { results: G.results.map((r) => ({ tier: r.tier, pts: r.pts })), total, archive: G.mode === "archive" });
  const st = store.get("stats", { played: 0, best: 0, streak: 0, last: 0, sum: 0, deep: 0, zero: 0, gems: 0 });
  st.sum = (st.sum || 0) + total; st.played++; st.best = Math.max(st.best, total);
  st.deep = (st.deep || 0) + G.results.filter((r) => r.tier >= 5).length;
  st.zero = (st.zero || 0) + G.results.filter((r) => r.tier === 0).length;
  st.gems = (st.gems || 0) + G.results.filter((r) => r.gem).length;
  if (G.mode === "daily") { st.streak = st.last === G.day - 1 ? st.streak + 1 : 1; st.last = G.day; }   // archive replays don't extend streaks
  store.set("stats", st);
  render();
}

      </div>
    </div>
    ${r.gem ? `<p style="color:var(--red);font-weight:600">※ You found the gem: the answer we hoped someone would land on.</p>` : ""}
    <p>${r.timeout ? "Time ran out." : yours ? `You said <b>${esc(r.raw)}</b>, which we count as <b>${esc(yours[1])}</b>.${yours[3] ? " " + esc(yours[3]) : ""}` : `<b>${esc(r.raw)}</b> isn't in our ledger for this prompt. If you think it should count, note it for review.`}</p>
    <h3>Deeper in the notes</h3>
    <ul class="notes">${deeper.map((x) => `<li><span class="n">${x.a[4] === 1 ? "※" : supNum(x.a[0])}</span><span><b>${esc(x.a[1])}</b>${x.a[4] === 1 ? ' <span class="n">the gem</span>' : ""}${x.a[3] ? `<small>${esc(x.a[3])}</small>` : ""}</span><span class="p">${TIERS[x.a[0]].pts}</span></li>`).join("")}</ul>
    <p class="dim">On the face of the statements: ${esc(face)}.</p>
    <div class="row"><button class="btn" data-act="next" id="nextbtn">${G.i + 1 < G.prompts.length ? "Next prompt" : "See my dive"}</button></div>
  </div>`;
}

function shareText(res, day, total) {
  return `Footnote #${day} · ${total} pages deep\n${res.map((r) => TIERS[r.tier].sq).join("")}\nReached ${depthName(total)}${SHARE_URL ? "\n" + SHARE_URL : ""}`;
}
function viewDone(saved) {
  const res = saved ? saved.results : G.results, total = saved ? saved.total : res.reduce((s, r) => s + r.pts, 0);
  const daily = saved || G.mode === "daily" || G.mode === "archive", day = saved ? today() : G.day;
  const text = shareText(res, day, total);
  return `<div class="card">
    <p class="dim">${daily ? "Footnote #" + day : "Practice dive"}</p>
    <div class="score">${total}</div>
    <p class="squares" aria-label="Tiers: ${res.map((r) => TIERS[r.tier].name).join(", ")}">${res.map((r) => TIERS[r.tier].sq).join("")}</p>
    <p class="depth">${total} pages deep · reached ${depthName(total)}</p>
    ${daily ? `<div class="share" id="sharetext">${esc(text)}</div>
    <div class="row"><button class="btn" data-act="copy">Copy result to text a friend</button></div>` : ""}
    <div class="row"><button class="btn ghost" data-act="practice">Practice dive</button><button class="btn ghost" data-act="home">Home</button></div>
    <p class="dim">A new daily dive starts at midnight.</p>
  </div>`;
}

// ---------- Pass the Ledger: pass-and-play party mode ----------
let P = null, ptimer = null;
const MIN_LEFT = 6000;                    // after a pass, at least 6 seconds remain on the fuse
function partySetup() { P = { phase: "setup", names: ["", "", ""] }; render(); }
function partyStart(names) {
  const players = names.map((n, k) => ({ name: n.trim() || "Player " + (k + 1), strikes: 0, pts: 0 }));
  if (players.length < 2) return toast("Add at least two players.");
  const deck = PROMPTS.slice(), r = rng(Math.floor(Math.random() * 1e9));
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  P = { phase: "play", players, turn: 0, deck, d: 0, msg: "" };
  partyRound();
}
function partyRound() {
  P.prompt = P.deck[P.d++ % P.deck.length]; P.used = []; P.msg = ""; P.phase = "play";
  P.fuseEnd = Date.now() + 10000 + Math.random() * 20000;      // hidden fuse: 10 to 30 seconds
  render();
  clearInterval(ptimer);
  ptimer = setInterval(() => { if (P && P.phase === "play" && Date.now() >= P.fuseEnd) partyPop(); }, 100);
}
const alive = () => P.players.filter((p) => p.strikes < 3);
function nextTurn() { do { P.turn = (P.turn + 1) % P.players.length; } while (P.players[P.turn].strikes >= 3); }
function partyAnswer(raw) {
  if (!P || P.phase !== "play" || !raw.trim()) return;
  const idx = match(P.prompt, raw), me = P.players[P.turn];
  if (idx === null) { P.msg = `"${raw.trim()}" isn't in the ledger. Try another!`; return render(); }
  if (P.used.some((u) => u.idx === idx)) { P.msg = `${P.prompt.a[idx][1]} was already said. Try another!`; return render(); }
  P.used.push({ idx, by: me.name }); me.pts += TIERS[P.prompt.a[idx][0]].pts;
  P.msg = `${me.name}: ${P.prompt.a[idx][1]} (+${TIERS[P.prompt.a[idx][0]].pts}). Pass the phone!`;
  if (P.fuseEnd - Date.now() < MIN_LEFT) P.fuseEnd = Date.now() + MIN_LEFT;
  nextTurn(); render();
}
function partyPop() {
  clearInterval(ptimer);
  const me = P.players[P.turn]; me.strikes++;
  P.popped = me.name; P.phase = alive().length <= 1 ? "over" : "pop";
  if (navigator.vibrate) try { navigator.vibrate(300); } catch (e) {}
  if (P.phase === "pop" && me.strikes >= 3) nextTurn();
  render();
}
const board = () => `<div class="board">${P.players.map((p) => `<span class="${p.strikes >= 3 ? "out" : ""}">${esc(p.name)}</span><span class="mono" style="font-family:var(--mono)">${"✗".repeat(p.strikes)}${"·".repeat(3 - p.strikes)}</span><span style="font-family:var(--mono)">${p.pts}</span>`).join("")}</div>`;
function viewParty() {
  if (P.phase === "setup") return `<div class="card">
    <h2>Pass the Ledger</h2>
    <p>One phone, two to eight players. Everyone gets the same prompt. On your turn, name a valid answer nobody has said yet, then pass the phone. A hidden fuse is ticking. Whoever is holding the phone when it pops takes a strike. Three strikes and you're out.</p>
    <form id="partyform" class="players">${P.names.map((n, k) => `<label class="dim" for="pn${k}" style="position:absolute;left:-9999px">Player ${k + 1}</label><input id="pn${k}" value="${esc(n)}" placeholder="Player ${k + 1}" maxlength="18">`).join("")}</form>
    <div class="row">${P.names.length < 8 ? `<button class="btn ghost" data-act="addp">Add a player</button>` : ""}<button class="btn" data-act="pstart">Start</button></div>
    <div class="row"><button class="btn ghost" data-act="home">Back</button></div></div>`;
  if (P.phase === "play") {
    const me = P.players[P.turn];
    return `<div class="card">
      <div class="qhead"><span class="sec ${P.prompt.sec}">${P.prompt.sec}</span><span class="fuse"><i></i>fuse is lit</span></div>
      <p class="prompt">${esc(P.prompt.q)}</p>
      <p class="big">${esc(me.name)}, your turn</p>
      <form class="ans" id="pform" autocomplete="off">
        <label for="pans" style="position:absolute;left:-9999px">Your answer</label>
        <input id="pans" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Name one fast" maxlength="80">
        <button class="btn" type="submit">Enter</button>
      </form>
      ${P.msg ? `<p role="status" style="font-weight:600">${esc(P.msg)}</p>` : ""}
      ${P.used.length ? `<div class="chips">${P.used.map((u) => `<span style="border-left:4px solid ${TIERS[P.prompt.a[u.idx][0]].c}">${esc(P.prompt.a[u.idx][1])}</span>`).join("")}</div>` : ""}
      ${board()}</div>`;
  }
  const missed = P.prompt.a.map((a, k) => ({ a, k })).filter((x) => !P.used.some((u) => u.idx === x.k)).sort((x, y) => y.a[0] - x.a[0]).slice(0, 4);
  const winner = alive()[0];
  return `<div class="card">
    <p class="tick" style="width:auto;text-align:left">※</p>
    <h2>${P.phase === "over" ? `${esc(winner ? winner.name : "Nobody")} wins the ledger!` : `The ledger popped on ${esc(P.popped)}.`}</h2>
    <h3>Answers nobody said</h3>
    <ul class="notes">${missed.map((x) => `<li><span class="n">${supNum(x.a[0])}</span><span><b>${esc(x.a[1])}</b>${x.a[3] ? `<small>${esc(x.a[3])}</small>` : ""}</span><span class="p">${TIERS[x.a[0]].pts}</span></li>`).join("")}</ul>
    ${board()}
    <div class="row">${P.phase === "over" ? `<button class="btn" data-act="party">New party</button>` : `<button class="btn" data-act="pnext">Next prompt: ${esc(P.players[P.turn].name)} starts</button>`}<button class="btn ghost" data-act="home">Home</button></div></div>`;
}

function render() {
  $("meta").innerHTML = `#${today()}<br>${new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
  let html;
  if (P) html = viewParty();
  else if (!G) html = viewHome();
  else if (G.phase === "prompt") html = viewPrompt();
  else if (G.phase === "result") html = viewResult();
  else html = viewDone();
  if (G === "summary") html = viewDone(store.get("day:" + today(), null));
  $("view").innerHTML = html;
  const inp = $("ans") || $("pans"); if (inp) inp.focus({ preventScroll: true });
  const nb = $("nextbtn"); if (nb) nb.focus({ preventScroll: true });
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2200); }

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "ansform") submit($("ans").value);
  if (e.target.id === "pform") partyAnswer($("pans").value);
  if (e.target.id === "partyform") partyStart(P.names.map((_, k) => $("pn" + k).value));
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  const keepNames = () => { if (P && P.phase === "setup") P.names = P.names.map((_, k) => ($("pn" + k) || {}).value || ""); };
  if (a === "party") { G = null; clearInterval(timer); partySetup(); }
  else if (a === "addp") { keepNames(); P.names.push(""); render(); }
  else if (a === "pstart") { keepNames(); partyStart(P.names); }
  else if (a === "pnext") partyRound();
  else if (a === "pack") { P = null; newDive("practice", b.dataset.v); }
  else if (a === "archive") { P = null; newDive("archive", +b.dataset.v); }
  else if (a === "daily") { if (store.get("day:" + today(), null)) { G = "summary"; render(); } else newDive("daily"); }
  else if (a === "practice") newDive("practice");
  else if (a === "next") next();
  else if (a === "home") { clearInterval(timer); clearInterval(ptimer); G = null; P = null; render(); }
  else if (a === "summary") { G = "summary"; render(); }
  else if (a === "copy") {
    const text = $("sharetext").textContent;
    try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into a text."); }
    catch (err) {
      const r = document.createRange(); r.selectNodeContents($("sharetext"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("Selected. Use Copy from your phone's menu.");
    }
  }
});
render();
</script>
</body>
</html>
