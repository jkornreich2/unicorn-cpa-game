<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemonade Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one green-bar ledger page on a desk; journal entries look like a real columnar journal. Single theme by choice. */
  color-scheme: light;
  --desk:#22352c;        /* dark blotter green behind the page */
  --page:#f1f6ec;        /* green-bar ledger paper */
  --bar:#dfead6;         /* alternate ruled band */
  --ink:#16243a;         /* blue-black fountain ink */
  --ink-soft:#4b5a70;
  --rule:#b9342e;        /* red margin rule and credit ink */
  --pencil:#f2c230;      /* yellow pencil accent */
  --line:#a9c1a2;
  --good:#1f7a4a;
  --bad:#b9342e;
  --t-a:#2757a6; --t-l:#b9342e; --t-e:#1f7a4a; --t-r:#a87400; --t-x:#6d3f93;
  --display:"Zilla Slab", Rockwell, "Courier New", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;color:var(--page)}
.brand{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.2px}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:6px}
.meta{display:flex;gap:14px;font-family:var(--mono);font-size:12px;text-align:right}
.meta b{display:block;font-size:18px;font-weight:600;color:var(--pencil);font-variant-numeric:tabular-nums}

/* Equation strip */
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;background:var(--ink);color:var(--page);border-radius:6px;padding:10px 12px}
.eq div{text-align:center}
.eq span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.eq b{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.eq i{font-style:normal;font-family:var(--mono);font-size:18px;color:var(--pencil)}

/* Tabs */
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:transparent;border:1.5px solid #4c6657;color:var(--page);border-radius:6px;padding:9px 6px;font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--pencil);border-color:var(--pencil);color:var(--ink);font-weight:600}

/* Ledger page */
.page{background:var(--page);border-radius:4px;padding:18px 16px 18px 28px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.page::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:4px;border-left:1px solid var(--rule);border-right:1px solid var(--rule);opacity:.7}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:34px}
h2{font-size:25px}
h3{font-size:18px}
p{margin:0}
.story{font-size:16.5px}
.amt{font-family:var(--mono);font-weight:600;background:var(--pencil);padding:1px 6px;border-radius:3px;white-space:nowrap}
.muted{color:var(--ink-soft);font-size:14px}

/* Journal entry */
.journal{width:100%;border-collapse:collapse;font-size:14.5px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.journal th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);color:var(--ink-soft)}
.journal td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.journal tr:nth-child(odd) td{background:var(--bar)}
.journal .n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;width:70px;border-left:1px solid var(--line)}
.journal th.n{text-align:right}
.slot{width:100%;min-height:44px;text-align:left;background:#fff;border:1.5px dashed var(--ink-soft);border-radius:4px;padding:8px 10px;font-weight:500}
.slot.cr{margin-left:22px;width:calc(100% - 22px)}
.slot.on{border-style:solid;border-color:var(--ink);box-shadow:0 0 0 3px var(--pencil)}
.slot.filled{border-style:solid}
.slot em{font-style:normal;color:var(--ink-soft);font-weight:400}
.crname{padding-left:22px}

/* Account chips */
.groups{display:flex;flex-direction:column;gap:10px}
.group span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{min-height:44px;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:4px;padding:7px 9px;font-size:14px;line-height:1.2}
.chip:active{transform:translateY(1px)}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink);border-left-color:var(--c)}

.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;border-radius:5px;padding:10px 16px;font-weight:600;border:1.5px solid var(--ink);background:transparent}
.btn.main{background:var(--ink);color:var(--page);flex:1}
.btn.main:disabled{opacity:.4;cursor:not-allowed}
.btn.opt{width:100%;text-align:left;background:#fff;font-weight:500}
.btn.opt b{display:block;font-family:var(--display);font-size:18px}
.btn.opt small{color:var(--ink-soft);font-size:13.5px}

.note{border-left:4px solid var(--c,var(--ink));background:#fff;padding:10px 12px;border-radius:0 4px 4px 0;font-size:15px}
.note.bad{--c:var(--bad)} .note.good{--c:var(--good)} .note.hint{--c:var(--pencil)}
.note b{font-weight:600}

.stamp{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--good);border:3px double var(--good);padding:2px 12px;border-radius:4px;transform:rotate(-4deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}

/* T-accounts and statements */
.taccts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tacct{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:3px;font-size:13px}
.tacct h4{margin:0;padding:5px 6px;font-family:var(--body);font-size:13px;font-weight:600;text-align:center;border-bottom:2px solid var(--ink)}
.tacct .cols{display:grid;grid-template-columns:1fr 1fr;min-height:34px}
.tacct .cols div{padding:4px 6px;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tacct .cols div:first-child{border-right:2px solid var(--ink)}
.tacct .bal{border-top:1px solid var(--line);padding:4px 6px;font-family:var(--mono);font-size:12px;text-align:center;background:var(--bar)}
.stmt{width:100%;border-collapse:collapse;font-size:15px}
.stmt td{padding:5px 4px;border-bottom:1px solid var(--line)}
.stmt td:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.stmt .tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
.stmt .sub td{padding-left:16px}
.stmt .hd td{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border-bottom:none;padding-top:10px}
.rules{width:100%;border-collapse:collapse;font-size:14px}
.rules th,.rules td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rules th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.rules td:first-child{font-weight:600;border-left:5px solid var(--c);padding-left:8px}
.up{font-family:var(--mono);font-weight:600}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.scroll{overflow-x:auto}
@media (max-width:360px){.chips,.taccts{grid-template-columns:1fr}.brand{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>General journal, week 1</small>Lemonade Ledger</div>
    <div class="meta"><div>Day<b id="mDay">1</b></div><div>Score<b id="mScore">0</b></div></div>
  </header>
  <section class="eq" aria-label="Accounting equation, live">
    <div><span>Assets</span><b id="eA">$0</b></div><i>=</i>
    <div><span>Liabilities</span><b id="eL">$0</b></div><i>+</i>
    <div><span>Equity</span><b id="eE">$0</b></div>
  </section>
  <nav class="tabs" role="tablist">
    <button role="tab" data-act="tab" data-v="play" id="tab-play">Play</button>
    <button role="tab" data-act="tab" data-v="ledger" id="tab-ledger">Ledger</button>
    <button role="tab" data-act="tab" data-v="rules" id="tab-rules">Rules</button>
  </nav>
  <main class="page" id="view"></main>
</div>

<script>
const ACC = {
  cash:{n:"Cash",t:"A"}, ar:{n:"Accounts Receivable",t:"A"}, supplies:{n:"Supplies",t:"A"}, equip:{n:"Equipment",t:"A"},
  ap:{n:"Accounts Payable",t:"L"}, loan:{n:"Loan Payable",t:"L"},
  capital:{n:"Owner's Capital",t:"E"}, draw:{n:"Owner's Drawings",t:"D"},
  sales:{n:"Sales Revenue",t:"R"},
  wages:{n:"Wages Expense",t:"X"}, supexp:{n:"Supplies Expense",t:"X"}, adv:{n:"Advertising Expense",t:"X"}
};
const GROUPS = [["Assets","A",["cash","ar","supplies","equip"]],["Liabilities","L",["ap","loan"]],["Equity","E",["capital","draw"]],["Revenue","R",["sales"]],["Expenses","X",["wages","supexp","adv"]]];
const COLOR = {A:"var(--t-a)",L:"var(--t-l)",E:"var(--t-e)",D:"var(--t-e)",R:"var(--t-r)",X:"var(--t-x)"};
const MAXPTS = 1100;

function buildSteps(ch){
  const onAcct = ch.pay === "account";
  const price3 = ch.price === "three";
  const sales = price3 ? 210 : 240;
  return [
    {day:1,title:"Open for business",amt:500,dr:"cash",cr:"capital",
     story:"You move <span class='amt'>$500</span> of your own savings into the stand's cash box.",
     hint:"The business received cash. Assets go up with a debit. The money came from you, the owner.",
     why:"Cash is an asset and it went up, so it is debited. The owner's stake in the business went up too, and equity grows with a credit."},
    {day:1,title:"A loan from Aunt Rosa",amt:300,dr:"cash",cr:"loan",
     story:"Aunt Rosa lends the stand <span class='amt'>$300</span>. She wants it back next month.",
     hint:"Cash came in again, but this time the business owes it back. What the business owes is a liability.",
     why:"Cash went up (debit). The business now owes Aunt Rosa, and liabilities grow with a credit. A loan is not revenue because you did not earn it."},
    {day:2,title:"Build the stand",amt:400,dr:"equip",cr:"cash",
     story:"You pay <span class='amt'>$400</span> cash for a wooden stand and a juicer that will last for years.",
     hint:"You swapped one asset for another. The thing you got goes up, the thing you gave goes down.",
     why:"Equipment went up (debit) and Cash went down (credit). Total assets did not change. Long-lasting items are assets, not expenses."},
    {day:2,title:"Stock up",amt:150,dr:"supplies",cr:onAcct?"ap":"cash",
     choice:{key:"pay",ask:"Lemons, sugar and cups cost $150. How do you pay?",opts:[
       {id:"cash",b:"Pay cash now",s:"Less cash on hand, but no bill hanging over you."},
       {id:"account",b:"Buy on account",s:"Keep your cash. The supplier sends a bill due Friday."}]},
     story: onAcct ? "You buy <span class='amt'>$150</span> of lemons, sugar and cups on account. The bill is due Friday."
                   : "You pay <span class='amt'>$150</span> cash for lemons, sugar and cups.",
     hint: onAcct ? "You received supplies and paid nothing yet. An unpaid supplier bill is Accounts Payable." : "You received supplies and handed over cash.",
     why: onAcct ? "Supplies went up (debit). You owe the supplier, so Accounts Payable, a liability, went up (credit). No cash moved."
                 : "Supplies went up (debit) and Cash went down (credit). The supplies are still an asset until you use them."},
    {day:3,title:"Set your price",amt:sales,dr:"cash",cr:"sales",
     choice:{key:"price",ask:"It is a hot Saturday. What do you charge per cup?",opts:[
       {id:"two",b:"$2 a cup",s:"Cheap and popular. Expect a long line."},
       {id:"three",b:"$3 a cup",s:"More per cup, but some people will walk past."}]},
     story: price3 ? "At $3 a cup you sell 70 cups. Customers pay <span class='amt'>$210</span> in cash."
                   : "At $2 a cup you sell 120 cups. Customers pay <span class='amt'>$240</span> in cash.",
     hint:"Cash came in because you sold something. Money earned from customers is revenue, and revenue grows with a credit.",
     why:"Cash went up (debit). Sales Revenue went up (credit). Revenue increases equity, which is why it sits on the credit side."},
    {day:4,title:"Birthday party order",amt:100,dr:"ar",cr:"sales",
     story:"You serve lemonade at a birthday party for <span class='amt'>$100</span>. The parent says, \"I'll pay you Saturday.\"",
     hint:"You did the work today but got no cash. A customer's promise to pay is an asset called Accounts Receivable.",
     why:"You earned the revenue today, so Sales Revenue is credited now. Since no cash arrived, the asset that went up is Accounts Receivable. Revenue is recorded when it is earned, not when it is collected."},
    {day:5,title:"Pay your helper",amt:60,dr:"wages",cr:"cash",
     story:"Your cousin squeezed lemons all week. You pay her <span class='amt'>$60</span> cash.",
     hint:"Cash went out and you got nothing you can keep. A cost of running the business is an expense. Expenses grow with a debit.",
     why:"Wages Expense went up (debit) and Cash went down (credit). Expenses reduce equity, so they sit on the debit side."},
    onAcct ?
    {day:5,title:"Pay the supplier",amt:150,dr:"ap",cr:"cash",
     story:"Friday. You pay the supplier's <span class='amt'>$150</span> bill from Day 2.",
     hint:"You are clearing a debt. A liability goes down with a debit.",
     why:"Accounts Payable went down (debit) and Cash went down (credit). This is not a new expense. You already recorded the supplies when you received them."}
    :
    {day:5,title:"Print some flyers",amt:20,dr:"adv",cr:"cash",
     story:"You pay <span class='amt'>$20</span> cash for flyers to tape around the park.",
     hint:"Cash went out for something that helps you sell this week. That is an expense.",
     why:"Advertising Expense went up (debit) and Cash went down (credit)."},
    {day:6,title:"The parent pays up",amt:100,dr:"cash",cr:"ar",
     story:"The birthday parent hands you <span class='amt'>$100</span> for Thursday's party.",
     hint:"Careful. You already recorded this sale on Day 4. Today a promise turned into cash.",
     why:"Cash went up (debit) and Accounts Receivable went down (credit). No new revenue today. One asset simply turned into another."},
    {day:6,title:"Treat yourself",amt:50,dr:"draw",cr:"cash",
     story:"You take <span class='amt'>$50</span> out of the cash box for a concert ticket.",
     hint:"This is personal, not a business cost. Money the owner takes out goes to Owner's Drawings.",
     why:"Owner's Drawings went up (debit) and Cash went down (credit). Drawings reduce equity but are not an expense, so they never touch profit."},
    {day:7,title:"Count the shelf",amt:110,dr:"supexp",cr:"supplies",
     story:"End of the week. You bought $150 of supplies and only $40 worth is left. You used up <span class='amt'>$110</span>.",
     hint:"No cash moves today. Part of an asset got used up, and used-up supplies become an expense.",
     why:"Supplies Expense went up (debit) and Supplies went down (credit). This is an adjusting entry. It moves the used part of an asset into expenses so profit is right."}
  ];
}

let S;
const fresh = () => ({phase:"intro",tab:"play",i:0,choices:{},entries:[],score:0,clean:0,attempts:0,hint:false,solved:false,dr:null,cr:null,active:"dr",msg:null});
const $ = (id) => document.getElementById(id);
const money = (v) => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US");
const steps = () => buildSteps(S.choices);
const cur = () => steps()[S.i];

function balances(){
  const b = {}; Object.keys(ACC).forEach(k => b[k] = 0);
  S.entries.forEach(e => { b[e.dr] += e.amt; b[e.cr] -= e.amt; });
  return b;
}
function totals(){
  const b = balances(); let A = 0, L = 0, E = 0;
  for (const k in b){ const t = ACC[k].t; if (t === "A") A += b[k]; else if (t === "L") L -= b[k]; else E -= b[k]; }
  return {A, L, E, b};
}

function renderChrome(){
  const t = totals();
  $("eA").textContent = money(t.A); $("eL").textContent = money(t.L); $("eE").textContent = money(t.E);
  const st = steps();
  $("mDay").textContent = S.phase === "done" ? 7 : st[Math.min(S.i, st.length - 1)].day;
  $("mScore").textContent = S.score;
  ["play","ledger","rules"].forEach(v => $("tab-" + v).setAttribute("aria-selected", String(S.tab === v)));
}

function slotHtml(side){
  const id = S[side], label = side === "dr" ? "Debit" : "Credit";
  const cls = "slot " + side + (S.active === side && !S.solved ? " on" : "") + (id ? " filled" : "");
  return `<button class="${cls}" id="slot-${side}" data-act="slot" data-v="${side}" ${S.solved ? "disabled" : ""}>${id ? ACC[id].n : `<em>Tap, then pick the ${label.toLowerCase()} account</em>`}</button>`;
}

function viewPlay(){
  if (S.phase === "intro") return `
    <div class="kicker">A game about debits and credits</div>
    <h1>Run a lemonade stand. Keep its books.</h1>
    <p class="story">Over seven days you will invest, borrow, buy, sell and pay people. Each time, you record what happened as a journal entry.</p>
    <ol class="how">
      <li>Read what happened.</li>
      <li>Pick one account to <b>debit</b> and one to <b>credit</b>.</li>
      <li>Post it. A right answer on the first try earns 100 points.</li>
    </ol>
    <div class="note hint"><b>The one rule to start with:</b> debit means the left side, credit means the right side. Assets and expenses go up with a debit. Liabilities, equity and revenue go up with a credit.</div>
    <div class="row"><button class="btn main" data-act="start">Open the books</button></div>
    <p class="muted">Stuck? The Rules tab has a cheat sheet. No accounting knowledge needed.</p>`;
  if (S.phase === "done") return viewDone();

  const st = steps(), s = st[S.i];
  const head = `<div class="kicker">Day ${s.day} &middot; Entry ${S.i + 1} of ${st.length}</div><h2>${s.title}</h2>`;
  if (s.choice && !S.choices[s.choice.key]) return head + `
    <p class="story">${s.choice.ask}</p>
    ${s.choice.opts.map(o => `<button class="btn opt" data-act="choose" data-k="${s.choice.key}" data-v="${o.id}"><b>${o.b}</b><small>${o.s}</small></button>`).join("")}
    <p class="muted">Your choice changes the entry you record and the numbers on your final statements.</p>`;

  const chips = GROUPS.map(([name, t, ids]) => `<div class="group"><span>${name}</span><div class="chips">${
    ids.map(id => `<button class="chip${S.dr === id || S.cr === id ? " sel" : ""}" style="--c:${COLOR[t]}" data-act="pick" data-v="${id}">${ACC[id].n}</button>`).join("")}</div></div>`).join("");
  const msg = S.msg ? `<div class="note ${S.msg.k}" role="status">${S.msg.t}</div>` : "";
  const body = S.solved ? `
      <div class="stamp">POSTED</div>
      <div class="note good"><b>Why:</b> ${s.why}</div>
      <div class="row"><button class="btn main" data-act="next">${S.i + 1 === st.length ? "Close the books" : "Next day's entry"}</button></div>`
    : `
      <div class="groups">${chips}</div>
      ${msg}
      <div class="row">
        <button class="btn" data-act="hint" ${S.hint ? "disabled" : ""}>Hint (-20)</button>
        <button class="btn main" data-act="post" ${S.dr && S.cr ? "" : "disabled"}>Post entry</button>
      </div>`;
  return head + `
    <p class="story">${s.story}</p>
    <table class="journal" aria-label="Journal entry">
      <tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>
      <tr><td>${slotHtml("dr")}</td><td class="n">${s.amt}</td><td class="n"></td></tr>
      <tr><td>${slotHtml("cr")}</td><td class="n"></td><td class="n">${s.amt}</td></tr>
    </table>` + body;
}

function statements(){
  const {b, A, L} = totals();
  const rev = -b.sales, exp = ["wages","supexp","adv"].filter(k => b[k]).map(k => [ACC[k].n, b[k]]);
  const texp = exp.reduce((a, x) => a + x[1], 0), ni = rev - texp;
  const cap = -b.capital, eq = cap + ni - b.draw;
  return {b, A, L, rev, exp, texp, ni, cap, eq};
}

function viewDone(){
  const f = statements(), pct = S.score / MAXPTS;
  const grade = pct >= .9 ? "Clean books" : pct >= .65 ? "Solid books" : "Books need a second look";
  const assets = ["cash","ar","supplies","equip"].filter(k => f.b[k]).map(k => `<tr class="sub"><td>${ACC[k].n}</td><td>${money(f.b[k])}</td></tr>`).join("");
  const liabs = ["ap","loan"].filter(k => f.b[k]).map(k => `<tr class="sub"><td>${ACC[k].n}</td><td>${money(-f.b[k])}</td></tr>`).join("");
  return `
    <div class="kicker">Week closed &middot; ${S.clean} of ${S.entries.length} entries right first time</div>
    <h2>${grade}: ${S.score} of ${MAXPTS} points</h2>
    <p class="story">Your eleven entries are all it takes to build the two statements every business reports.</p>
    <h3>Income statement</h3>
    <p class="muted">Did the stand make money this week?</p>
    <table class="stmt">
      <tr><td>Sales Revenue</td><td>${money(f.rev)}</td></tr>
      ${f.exp.map(x => `<tr class="sub"><td>${x[0]}</td><td>(${money(x[1])})</td></tr>`).join("")}
      <tr class="tot"><td>Net income (profit)</td><td>${money(f.ni)}</td></tr>
    </table>
    <h3>Balance sheet</h3>
    <p class="muted">What does the stand own and owe at the end of Day 7?</p>
    <table class="stmt">
      <tr class="hd"><td colspan="2">Assets</td></tr>${assets}
      <tr class="tot"><td>Total assets</td><td>${money(f.A)}</td></tr>
      <tr class="hd"><td colspan="2">Liabilities</td></tr>${liabs}
      <tr class="hd"><td colspan="2">Equity</td></tr>
      <tr class="sub"><td>Owner's Capital</td><td>${money(f.cap)}</td></tr>
      <tr class="sub"><td>Plus net income</td><td>${money(f.ni)}</td></tr>
      <tr class="sub"><td>Less drawings</td><td>(${money(f.b.draw)})</td></tr>
      <tr class="tot"><td>Total liabilities and equity</td><td>${money(f.L + f.eq)}</td></tr>
    </table>
    <div class="note good"><b>Notice:</b> total assets (${money(f.A)}) equal liabilities plus equity (${money(f.L + f.eq)}). Because every entry had equal debits and credits, the books balance. Also notice profit (${money(f.ni)}) is not the same as the cash in the box (${money(f.b.cash)}).</div>
    <div class="row"><button class="btn main" data-act="again">Play again with different choices</button></div>`;
}

function viewLedger(){
  if (!S.entries.length) return `<div class="kicker">General ledger</div><h2>Nothing posted yet</h2><p class="story">Post your first entry on the Play tab. It will appear here in the journal and in each account's T-account.</p>`;
  const rows = S.entries.map(e => `
    <tr><td>Day ${e.day}: ${ACC[e.dr].n}</td><td class="n">${e.amt}</td><td class="n"></td></tr>
    <tr><td class="crname">${ACC[e.cr].n}</td><td class="n"></td><td class="n">${e.amt}</td></tr>`).join("");
  const b = balances();
  const ts = Object.keys(ACC).filter(k => S.entries.some(e => e.dr === k || e.cr === k)).map(k => {
    const d = S.entries.filter(e => e.dr === k).map(e => e.amt), c = S.entries.filter(e => e.cr === k).map(e => e.amt);
    const bal = b[k];
    return `<div class="tacct" style="--c:${COLOR[ACC[k].t]}"><h4>${ACC[k].n}</h4><div class="cols"><div>${d.join("<br>")}</div><div>${c.join("<br>")}</div></div><div class="bal">Balance ${money(Math.abs(bal))} ${bal === 0 ? "" : bal > 0 ? "Dr" : "Cr"}</div></div>`;
  }).join("");
  return `<div class="kicker">General ledger</div><h2>The journal</h2>
    <div class="scroll"><table class="journal"><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>${rows}</table></div>
    <h3>T-accounts</h3><p class="muted">Debits on the left, credits on the right. The balance is the difference.</p>
    <div class="taccts">${ts}</div>`;
}

function viewRules(){
  const r = [["Assets","A","What the business owns","Debit","Cash, Supplies, Equipment"],["Liabilities","L","What it owes","Credit","Accounts Payable, Loan Payable"],["Equity","E","The owner's stake","Credit","Owner's Capital"],["Revenue","R","Earned from customers","Credit","Sales Revenue"],["Expenses","X","Costs of running it","Debit","Wages, Supplies used"],["Drawings","D","Owner takes money out","Debit","Owner's Drawings"]];
  return `<div class="kicker">Cheat sheet</div><h2>Which side makes it go up?</h2>
    <div class="scroll"><table class="rules"><tr><th>Type</th><th>Means</th><th>Goes up with</th></tr>
    ${r.map(x => `<tr><td style="--c:${COLOR[x[1]]}">${x[0]}</td><td>${x[2]}<br><span class="muted">${x[4]}</span></td><td class="up">${x[3]}</td></tr>`).join("")}</table></div>
    <div class="note hint">An account goes <b>down</b> on the opposite side. Cash goes up with a debit, so paying cash is a credit to Cash.</div>
    <h3>Three things to remember</h3>
    <ol class="how">
      <li>Debit and credit only mean left and right. Neither one means good or bad.</li>
      <li>Every entry has equal debits and credits. That keeps Assets = Liabilities + Equity true after every entry.</li>
      <li>Ask two questions each time: what did the business get, and where did it come from?</li>
    </ol>`;
}

function render(){
  renderChrome();
  $("view").innerHTML = S.tab === "ledger" ? viewLedger() : S.tab === "rules" ? viewRules() : viewPlay();
}

function wrongMsg(s){
  if (S.dr === s.cr && S.cr === s.dr) return "You picked the right two accounts, but on the wrong sides. Swap them.";
  if (S.dr === s.dr) return "Your debit is right. Rethink the credit: where did the value come from?";
  if (S.cr === s.cr) return "Your credit is right. Rethink the debit: what did the business get, or what cost did it take on?";
  return "Not yet. Ask two questions: what did the business get, and where did it come from?";
}

function act(a, d){
  const s = S.phase === "play" ? cur() : null;
  if (a === "tab") S.tab = d.v;
  else if (a === "start") S.phase = "play";
  else if (a === "again") { S = fresh(); S.phase = "play"; }
  else if (a === "choose") S.choices[d.k] = d.v;
  else if (a === "slot") { if (S[d.v]) S[d.v] = null; S.active = d.v; }
  else if (a === "pick") {
    if (S.dr === d.v) { S.dr = null; S.active = "dr"; }
    else if (S.cr === d.v) { S.cr = null; S.active = "cr"; }
    else { S[S.active] = d.v; S.active = S.active === "dr" ? (S.cr ? "dr" : "cr") : (S.dr ? "cr" : "dr"); }
    S.msg = S.msg && S.msg.k === "hint" ? S.msg : null;
  }
  else if (a === "hint") { S.hint = true; S.msg = {k:"hint", t:"<b>Hint:</b> " + s.hint}; }
  else if (a === "post" && S.dr && S.cr) {
    if (S.dr === s.dr && S.cr === s.cr) {
      let pts = [100, 60, 30][S.attempts] || 0;
      if (S.hint) pts = Math.max(pts - 20, 0);
      if (S.attempts === 0 && !S.hint) S.clean++;
      S.score += pts; S.solved = true; S.msg = null;
      S.entries.push({day:s.day, dr:s.dr, cr:s.cr, amt:s.amt});
    } else {
      S.attempts++;
      if (S.attempts >= 3) { S.dr = s.dr; S.cr = s.cr; S.msg = {k:"bad", t:"Here is the entry: debit <b>" + ACC[s.dr].n + "</b>, credit <b>" + ACC[s.cr].n + "</b>. Post it to see why."}; }
      else S.msg = {k:"bad", t: wrongMsg(s) + (S.attempts === 2 ? " <b>Hint:</b> " + s.hint : "")};
    }
  }
  else if (a === "next") {
    S.i++; S.attempts = 0; S.hint = false; S.solved = false; S.dr = S.cr = null; S.active = "dr"; S.msg = null;
    if (S.i >= steps().length) S.phase = "done";
    window.scrollTo(0, 0);
  }
  render();
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (el && !el.disabled) act(el.dataset.act, el.dataset);
});

function start(saved){
  S = Object.assign(fresh(), saved && saved.phase ? saved : {});
  render();
}
window.claude?.hot?.snapshot?.(() => S);
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
